  /* ---------- AI Routine Assistant (local Ollama, suggestion only) ----------
     The model only SUGGESTS a routine. Nothing here sends a command or changes a device setting.
     Safety rules live in code, not in the model: red-flag checks run before the model is called,
     and every number the model returns is clamped to the exerciser's firmware limits. */
  const RT = {
    LIMITS: { speedMin: 25, speedMax: 80, minutesMin: 5, minutesMax: 60, sessionsMin: 1, sessionsMax: 3, daysMin: 3, daysMax: 7, maxWeeklySpeedStep: 10 },
    PREFERRED_MODELS: ['qwen2.5:3b', 'llama3.2:3b', 'gemma3:4b', 'qwen2.5:7b', 'llama3.1:8b'],
    PRECAUTIONS: [
      ['fracture', 'Recent fracture in the leg or hip'],
      ['dvt', 'Blood clot (DVT) or leg swelling with pain'],
      ['surgery', 'Leg, hip or spine surgery in the last 6 weeks'],
      ['wound', 'Open wound or pressure sore on the legs'],
      ['bp', 'Uncontrolled blood pressure or recent chest pain'],
      ['pain', 'Severe pain when the leg is moved'],
    ],
    // words in the free-text instructions that stop the model from being called
    RED_WORDS: ['fracture', 'broken bone', 'dvt', 'thrombosis', 'blood clot', 'clot', 'bedsore', 'pressure sore', 'pressure ulcer', 'open wound',
      'chest pain', 'do not exercise', 'no exercise', 'bed rest only', 'ভাঙা', 'ভেঙে', 'রক্ত জমাট', 'জমাট', 'ক্ষত', 'বেডসোর', 'বুকে ব্যথা', 'ব্যায়াম নিষেধ'],
    CONDITIONS: ['Stroke (one side weak)', 'Spinal cord injury', 'After knee or hip surgery (cleared by surgeon)', 'Elderly muscle weakness', 'Parkinson\'s disease', 'Other'],
  }

  function rtLoad(key, fallback) { try { const v = localStorage.getItem('smartleg.rt.' + key); return v ? JSON.parse(v) : fallback } catch (e) { return fallback } }
  function rtSave(key, v) { try { localStorage.setItem('smartleg.rt.' + key, JSON.stringify(v)) } catch (e) { /* storage unavailable */ } }

  const rtClamp = (v, lo, hi, dflt) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt }

  /** Clamp model output to firmware limits and limit week-to-week speed jumps. Returns { plan, adjusted[] }. */
  function rtValidate(raw) {
    const L = RT.LIMITS, adjusted = []
    const str = (v, max = 400) => (typeof v === 'string' ? v.trim().slice(0, max) : '')
    const list = (v, n = 6) => (Array.isArray(v) ? v.map((x) => str(String(x), 240)).filter(Boolean).slice(0, n) : [])
    const weeksIn = Array.isArray(raw && raw.weeks) ? raw.weeks.slice(0, 4) : []
    if (!weeksIn.length) throw new Error('The model did not return a weekly plan. Try again or use a larger model.')
    let prevSpeed = null
    const weeks = weeksIn.map((w, i) => {
      const out = {
        week: i + 1,
        days_per_week: rtClamp(w.days_per_week, L.daysMin, L.daysMax, 5),
        sessions_per_day: rtClamp(w.sessions_per_day, L.sessionsMin, L.sessionsMax, 2),
        minutes: rtClamp(w.minutes, L.minutesMin, L.minutesMax, 10),
        speed_pct: rtClamp(w.speed_pct, L.speedMin, L.speedMax, 30),
        focus: str(w.focus, 200),
      }
      const check = (k) => { if (Number(w[k]) !== out[k]) adjusted.push(`Week ${i + 1} ${k.replace(/_/g, ' ')}: ${w[k] ?? 'missing'} → ${out[k]}`) }
      ;['days_per_week', 'sessions_per_day', 'minutes', 'speed_pct'].forEach(check)
      if (prevSpeed != null && out.speed_pct > prevSpeed + L.maxWeeklySpeedStep) {
        adjusted.push(`Week ${i + 1} speed: ${out.speed_pct}% → ${prevSpeed + L.maxWeeklySpeedStep}% (max +${L.maxWeeklySpeedStep}% per week)`)
        out.speed_pct = prevSpeed + L.maxWeeklySpeedStep
      }
      prevSpeed = out.speed_pct
      return out
    })
    return {
      plan: {
        summary: str(raw.summary, 600),
        weeks,
        daily_tips: list(raw.daily_tips),
        stop_signs: list(raw.stop_signs),
        questions_for_therapist: list(raw.questions_for_therapist, 4),
      },
      adjusted,
    }
  }

  /** Conservative fixed plan used when no model is reachable (clearly labelled, not AI). */
  function rtSamplePlan() {
    return {
      summary: 'A gentle 4-week starting plan for passive leg cycling. Start slow, watch how the patient responds, and only increase when the previous week felt comfortable.',
      weeks: [
        { week: 1, days_per_week: 5, sessions_per_day: 2, minutes: 10, speed_pct: 30, focus: 'Get used to the movement; stay at a slow speed.' },
        { week: 2, days_per_week: 5, sessions_per_day: 2, minutes: 12, speed_pct: 35, focus: 'Slightly longer sessions if week 1 was comfortable.' },
        { week: 3, days_per_week: 6, sessions_per_day: 2, minutes: 15, speed_pct: 40, focus: 'Build routine; keep the same time of day.' },
        { week: 4, days_per_week: 6, sessions_per_day: 2, minutes: 15, speed_pct: 45, focus: 'Hold steady and review progress with the therapist.' },
      ],
      daily_tips: ['Check the skin under the foot straps before and after each session.', 'Keep the patient comfortably positioned with the back supported.', 'Offer water after the session.'],
      stop_signs: ['Pain, cramp or sudden stiffness in the leg', 'Dizziness, breathlessness or chest discomfort', 'New swelling, redness or warmth in the calf'],
      questions_for_therapist: ['Is this speed safe for the affected leg?', 'When should the session length be increased?'],
    }
  }

  function rtRedFlags(form) {
    const hits = RT.PRECAUTIONS.filter(([k]) => form.flags[k]).map(([, label]) => label)
    const text = (form.instructions || '').toLowerCase()
    const words = RT.RED_WORDS.filter((w) => text.includes(w.toLowerCase()))
    if (words.length) hits.push('Instructions mention: ' + words.join(', '))
    return hits
  }

  function rtPrompt(form) {
    const L = RT.LIMITS
    const system = `You help a physiotherapist plan home sessions on "SmartLeg", a motorized PASSIVE leg cycling exerciser.
You only make SUGGESTIONS for the therapist to review. You never diagnose, never prescribe medicine, never promise recovery.
Device limits you must respect: speed ${L.speedMin}-${L.speedMax}% (start low, 25-35% in week 1), each session ${L.minutesMin}-${L.minutesMax} minutes,
${L.sessionsMin}-${L.sessionsMax} sessions per day, increase speed by at most ${L.maxWeeklySpeedStep}% per week. Be conservative for elderly or very weak patients.
Follow the doctor's or therapist's written instructions exactly when they set a limit.
Reply with ONLY a JSON object, no other text, in this exact shape:
{"summary": string, "weeks": [{"week": 1, "days_per_week": int, "sessions_per_day": int, "minutes": int, "speed_pct": int, "focus": string}, ... 4 weeks],
 "daily_tips": [string, up to 4], "stop_signs": [string, up to 4], "questions_for_therapist": [string, up to 3]}
Write all string values in ${form.lang === 'bn' ? 'clear Bangla (Bengali script)' : 'simple English'}. Keep every string short.`
    const lines = [
      `Age: ${form.age || 'not given'}`,
      `Sex: ${form.sex || 'not given'}`,
      `Condition: ${form.condition}`,
      `Affected side: ${form.side}`,
      `Weeks since onset or surgery: ${form.weeks || 'not given'}`,
      `Can the patient sit with back support: ${form.sitting}`,
      `Muscle strength of affected leg (MMT 0-5): ${form.mmt}`,
      `Stiffness (Modified Ashworth 0-4): ${form.ash}`,
      `Pain score (0-10): ${form.pain === '' ? 'not given' : form.pain}`,
      `Doctor / physiotherapist instructions: ${form.instructions || 'none written'}`,
      form.image ? 'A photo of the prescription is attached. Use only what you can read clearly; ignore anything unclear.' : '',
    ].filter(Boolean)
    return { system, user: 'Patient details:\n' + lines.join('\n') + '\n\nSuggest a 4-week SmartLeg routine.' }
  }

  function rtExtractJSON(text) {
    try { return JSON.parse(text) } catch (e) { /* try to find the object inside */ }
    const a = text.indexOf('{'), b = text.lastIndexOf('}')
    if (a >= 0 && b > a) { try { return JSON.parse(text.slice(a, b + 1)) } catch (e) { /* fall through */ } }
    throw new Error('The model reply was not valid JSON. Press Generate again, or try a larger model.')
  }

  /* ---------- Built-in routine model (a .keras model converted to JSON, runs in this browser) ---------- */
  const ML = {
    CONDITION_KEYS: {
      'Stroke (one side weak)': 'stroke', 'Spinal cord injury': 'spinal_cord_injury', 'After knee or hip surgery (cleared by surgeon)': 'post_surgery',
      'Elderly muscle weakness': 'elderly_weakness', 'Parkinson\'s disease': 'parkinsons', 'Other': 'other',
    },
    MMT: ['0: none', '1: flicker', '2: no gravity', '3: vs gravity', '4: some resistance', '5: normal'],
    ASHWORTH: ['0: normal', '1: slight', '2: marked', '3: considerable', '4: rigid'],
    LABELS: { age: 'Age', weeks_since_onset: 'Weeks since onset', muscle_strength_mmt: 'Muscle strength', spasticity_ashworth: 'Stiffness (Ashworth)', pain_0_10: 'Pain score', sits_with_support: 'Sitting ability', both_sides: 'Both legs affected' },
  }

  /** Throws if the JSON is not a SmartLeg model this page can run. */
  function mlCheck(doc) {
    if (!doc || doc.format !== 'smartleg-mlp-v1') throw new Error('This is not a SmartLeg model file. Convert your .keras with ml/keras_to_web.py first.')
    if (!Array.isArray(doc.features) || doc.features.length !== 13) throw new Error('The model must take the 13 SmartLeg inputs.')
    const names = new Set((doc.layers || []).map((l) => l.name))
    if (!names.has('plan') || !names.has('caution')) throw new Error("The model needs output layers named 'plan' and 'caution'.")
    const bad = doc.layers.find((l) => !['input', 'norm', 'dense'].includes(l.type))
    if (bad) throw new Error(`Unsupported layer "${bad.name}". Only Normalization and Dense layers can run in the browser.`)
    return doc
  }

  /** Forward pass: the same maths Keras does for Normalization + Dense layers. */
  function mlRun(doc, x) {
    const out = {}
    const acts = {
      relu: (v) => v.map((a) => (a > 0 ? a : 0)), linear: (v) => v, tanh: (v) => v.map(Math.tanh),
      sigmoid: (v) => v.map((a) => 1 / (1 + Math.exp(-a))),
      softmax: (v) => { const m = Math.max(...v); const e = v.map((a) => Math.exp(a - m)); const s = e.reduce((p, q) => p + q, 0); return e.map((a) => a / s) },
    }
    for (const l of doc.layers) {
      if (l.type === 'input') { out[l.name] = x; continue }
      const v = l.input ? out[l.input] : x
      if (l.type === 'norm') out[l.name] = v.map((a, i) => (a - l.mean[i]) / l.std[i])
      else {
        const z = l.bias.slice()
        for (let i = 0; i < v.length; i++) { const row = l.kernel[i]; for (let j = 0; j < z.length; j++) z[j] += v[i] * row[j] }
        out[l.name] = acts[l.activation](z)
      }
    }
    return { plan: out.plan, caution: out.caution }
  }

  function mlInputs(doc, form) {
    const assumed = []
    const num = (v, dflt, label) => { const n = Number(v); if (v === '' || v == null || !Number.isFinite(n)) { assumed.push(`${label} not given, assumed ${dflt}`); return dflt } return n }
    const cond = ML.CONDITION_KEYS[form.condition] || 'other'
    const values = {
      age: Math.min(100, Math.max(10, num(form.age, 60, 'Age'))),
      weeks_since_onset: Math.min(104, Math.max(0, num(form.weeks, 8, 'Weeks since onset'))),
      muscle_strength_mmt: Number(form.mmt), spasticity_ashworth: Number(form.ash),
      pain_0_10: Math.min(10, Math.max(0, num(form.pain, 2, 'Pain score'))),
      sits_with_support: form.sitting === 'Yes' ? 1 : 0, both_sides: form.side === 'Both' ? 1 : 0,
    }
    doc.conditions.forEach((c) => { values['cond_' + c] = c === cond ? 1 : 0 })
    const x = doc.features.map((f) => { if (!(f in values)) throw new Error(`The model asks for an input "${f}" this page does not have.`); return values[f] })
    return { x, values, assumed }
  }

  function mlPlan(doc, form) {
    const { x, values, assumed } = mlInputs(doc, form)
    const y = mlRun(doc, x)
    const [s0, m0, sess, sstep, mstep] = y.plan
    const levels = doc.caution_classes
    const ci = y.caution.indexOf(Math.max(...y.caution))
    const level = levels[ci]
    const bn = form.lang === 'bn'

    const r = (v) => Math.round(v)
    const days = level === 'low' ? [5, 6, 6, 6] : [5, 5, 5, 6]
    const focusEn = ['Get used to the movement at a slow speed.', 'Increase only if week 1 felt comfortable.', 'Build the habit; keep the same time each day.', 'Hold steady and review progress with the therapist.']
    const focusBn = ['ধীর গতিতে নড়াচড়ায় অভ্যস্ত হওয়া।', 'প্রথম সপ্তাহ আরামদায়ক হলে তবেই বাড়ানো।', 'প্রতিদিন একই সময়ে ব্যায়ামের অভ্যাস গড়া।', 'একই মাত্রায় রেখে থেরাপিস্টের সাথে অগ্রগতি দেখা।']
    const raw = {
      weeks: [0, 1, 2, 3].map((i) => ({ week: i + 1, days_per_week: days[i], sessions_per_day: r(sess), minutes: r(m0 + mstep * i), speed_pct: r(s0 + sstep * i), focus: (bn ? focusBn : focusEn)[i] })),
    }
    raw.summary = bn
      ? `${r(s0)}% গতিতে ${r(m0)} মিনিট, দিনে ${r(sess)} বার দিয়ে শুরু। সহ্য হলে প্রতি সপ্তাহে প্রায় ${r(sstep)}% গতি বাড়ানো যাবে। সতর্কতার মাত্রা: ${({ low: 'কম', medium: 'মাঝারি', high: 'বেশি' })[level]}।`
      : `Start at ${r(s0)}% speed for ${r(m0)} minutes, ${r(sess)} time${r(sess) > 1 ? 's' : ''} a day, and raise the speed by about ${r(sstep)}% a week if it is well tolerated. Caution level: ${level}.`
    const tips = bn
      ? ['প্রতিটি সেশনের আগে ও পরে স্ট্র্যাপের নিচের চামড়া দেখুন।', 'রোগীর পিঠে ভালো সাপোর্ট রাখুন।', 'সেশনের পরে পানি খেতে দিন।']
      : ['Check the skin under the foot straps before and after each session.', 'Keep the back well supported and the patient comfortable.', 'Offer water after the session.']
    const stop = bn
      ? ['পায়ে ব্যথা, টান বা হঠাৎ শক্ত হয়ে যাওয়া', 'মাথা ঘোরা, শ্বাসকষ্ট বা বুকে অস্বস্তি', 'পায়ের গোছায় নতুন ফোলা, লাল ভাব বা গরম হওয়া']
      : ['Pain, cramp or sudden stiffness in the leg', 'Dizziness, breathlessness or chest discomfort', 'New swelling, redness or warmth in the calf']
    if (level === 'high') tips.unshift(bn ? 'পুরো সেশনে একজন সেবাদানকারী পাশে থাকবেন।' : 'A caregiver should stay beside the patient for the whole session.')
    if (values.spasticity_ashworth >= 2) stop.push(bn ? 'পা ঝাঁকুনি দিলে বা খুব শক্ত হলে গতি কমান বা থামান' : 'The leg jerks or stiffens a lot: lower the speed or stop')
    raw.daily_tips = tips
    raw.stop_signs = stop
    raw.questions_for_therapist = bn
      ? ['এই শুরুর গতি কি এই রোগীর জন্য নিরাপদ?', 'কখন সেশনের সময় বাড়ানো যাবে?']
      : ['Is this starting speed safe for this patient?', 'When should the session length be increased?']
    const { plan, adjusted } = rtValidate(raw)

    // what shaped the plan: replace one input at a time with the typical (training average) value
    const norm = doc.layers.find((l) => l.type === 'norm')
    const influences = []
    if (norm) {
      Object.keys(ML.LABELS).forEach((f) => {
        const i = doc.features.indexOf(f)
        if (i < 0) return
        const x2 = x.slice(); x2[i] = norm.mean[i]
        const y2 = mlRun(doc, x2).plan
        const dS = s0 - y2[0], dM = m0 - y2[1]
        const shown = f === 'muscle_strength_mmt' ? ML.MMT[values[f]] : f === 'spasticity_ashworth' ? ML.ASHWORTH[values[f]]
          : f === 'sits_with_support' ? (values[f] ? 'sits with support' : 'lying only') : f === 'both_sides' ? (values[f] ? 'yes' : 'no') : String(Math.round(values[f]))
        influences.push({ label: ML.LABELS[f], value: shown, dSpeed: dS, dMin: dM, weight: Math.abs(dS) + Math.abs(dM) })
      })
      influences.sort((a, b) => b.weight - a.weight)
    }
    const atFloor = s0 <= 26 && m0 <= 7   // already the gentlest plan: single factors cannot lower it further
    return { plan, adjusted, caution: { level, probs: levels.map((k, i) => ({ k, p: y.caution[i] })) }, influences: atFloor ? [] : influences.slice(0, 3).filter((v) => v.weight >= 0.5), atFloor, assumed }
  }

    const $m = (s) => $(s, main)

    function readForm() {
      form.name = $m('#rt-name').value.trim()
      form.age = $m('#rt-age').value
      form.sex = $m('#rt-sex').value
      form.weeks = $m('#rt-weeks').value
      form.condition = $m('#rt-cond').value
      form.side = $m('#rt-side').value
      form.sitting = $m('#rt-sit').value
      form.mmt = $m('#rt-mmt').value
      form.ash = $m('#rt-ash').value
      form.pain = $m('#rt-pain').value
      form.lang = $m('#rt-lang').value
      form.instructions = $m('#rt-instr').value.trim()

    }

      const f = e.target.files && e.target.files[0]
      form.image = null
      if (!f) { $m('#rt-img-note').textContent = 'Typed instructions are more reliable than handwriting.'; return }
      if (f.size > 8 * 1024 * 1024) { $m('#rt-img-note').textContent = 'Photo is larger than 8 MB. Please use a smaller photo.'; e.target.value = ''; return }
      const r = new FileReader()
      r.onload = () => {
        form.image = String(r.result).split(',')[1]
        $m('#rt-img-note').innerHTML = `Attached: ${esc(f.name)}. Choose a vision model such as qwen2.5vl:3b to read it. <button type="button" class="rt-link" id="rt-img-clear">Remove photo</button>`
        $m('#rt-img-clear').onclick = () => { form.image = null; $m('#rt-img').value = ''; $m('#rt-img-note').textContent = 'Typed instructions are more reliable than handwriting.' }
      }
      r.readAsDataURL(f)
    }

    function showConn() {
      const pill = $m('#rt-pill'), help = $m('#rt-conn-help')
      if (st.connected === null) pill.innerHTML = '<span class="badge b-stale"><span class="dot"></span>Not checked</span>'
      else if (st.connected) pill.innerHTML = `<span class="badge b-online"><span class="dot"></span>Ollama connected</span>`
      else pill.innerHTML = '<span class="badge b-offline"><span class="dot"></span>Not reachable</span>'
      const sel = $m('#rt-model')
      const names = st.models.length ? st.models : (conn.model ? [conn.model] : [])
      sel.innerHTML = names.length ? names.map((n) => opt(n, conn.model)).join('') : '<option value="">No models found</option>'
      if (names.length && !names.includes(conn.model)) { conn.model = names[0]; sel.value = conn.model }
      help.innerHTML = st.connected === false ? `<div class="rt-help">
          <b>Ollama is not reachable.</b> On this computer:
          <ol><li>Install Ollama from ollama.com and pull a model: <code>ollama pull qwen2.5:3b</code></li>

        : (st.connected && !st.models.length ? '<div class="rt-help">Connected, but no models are installed. Run <code>ollama pull qwen2.5:3b</code> and check again.</div>' : '')
    }

    async function checkConn() {
      conn.url = $m('#rt-url').value.trim().replace(/\/+$/, '') || 'http://localhost:11434'
      rtSave('conn', conn)
      $m('#rt-test').disabled = true
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000)
        const res = await fetch(conn.url + '/api/tags', { signal: ctl.signal })
        clearTimeout(t)
        if (!res.ok) throw new Error('HTTP ' + res.status)
        const j = await res.json()
        st.models = (j.models || []).map((m) => m.name).sort((a, b) => {
          const ia = RT.PREFERRED_MODELS.indexOf(a), ib = RT.PREFERRED_MODELS.indexOf(b)
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b)
        })
        st.connected = true
      } catch (e) { st.connected = false; st.models = [] }
      $m('#rt-test').disabled = false
      showConn()
    }
    $m('#rt-test').onclick = checkConn
    $m('#rt-model').onchange = (e) => { conn.model = e.target.value; rtSave('conn', conn) }

    function setStatus(text, cls = '') { const s = $m('#rt-status'); s.className = 'rt-status ' + cls; s.innerHTML = text }

    function blockedHTML(flags) {
      return card('Routine not generated', `<div class="alert error"><span>&#9888;</span><span>
        <b>A physiotherapist or doctor must clear this patient before any machine exercise.</b> The assistant stopped because of:
        <ul class="rt-list">${flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
        If the clinician has already cleared exercise, ask them to write the session time and speed directly; the assistant will not plan around these warnings.</span></div>`)
    }

    function renderResult() {
      const out = $m('#rt-out')
      if (st.error) { out.innerHTML = errorBox(st.error); return }
      const r = st.result
      if (!r) { out.innerHTML = ''; return }
      if (r.blocked) { out.innerHTML = blockedHTML(r.blocked); return }
      const p = r.plan
      const bn = r.lang === 'bn'
      const rows = p.weeks.map((w) => `<tr><td><b>Week ${w.week}</b></td><td class="tabular">${w.days_per_week} days</td><td class="tabular">${w.sessions_per_day} × ${w.minutes} min</td>
        <td><span class="rt-speed"><span style="width:${Math.round(((w.speed_pct - L.speedMin) / (L.speedMax - L.speedMin)) * 100)}%"></span></span><b class="tabular">${w.speed_pct}%</b></td>
        <td class="rt-wrap">${esc(w.focus)}</td></tr>`).join('')
      const ul = (items) => items.length ? `<ul class="rt-list">${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="xs muted">None given.</p>'
      const who = r.form.name ? esc(r.form.name) + ' · ' : ''
      out.innerHTML = `<section class="card rt-result" ${bn ? 'lang="bn"' : ''}>
        <div class="card-head"><h2>Suggested routine ${r.sample ? '<span class="badge b-stale"><span class="dot"></span>Sample plan, not AI</span>' : r.engine === 'model' ? '<span class="badge b-online"><span class="dot"></span>Built-in model</span>' : '<span class="badge b-online"><span class="dot"></span>AI suggestion</span>'}</h2>
          <div class="no-print rt-actions"><button class="btn secondary" id="rt-copy">Copy text</button><button class="btn secondary" id="rt-print">Print</button></div></div>
        <div class="card-body stack">
          <p class="xs muted">${who}${esc(r.form.condition)}, ${esc(r.form.side.toLowerCase())} side${r.form.age ? ', age ' + esc(r.form.age) : ''} · ${r.sample ? 'Fixed sample plan' : r.engine === 'model' ? 'Model: ' + esc(r.model) + ' (.keras, ran in this browser)' : 'Model: ' + esc(r.model)} · ${esc(new Date(r.at).toLocaleString())}</p>
          ${p.summary ? `<p class="rt-summary">${esc(p.summary)}</p>` : ''}
          <div class="rt-table"><table><thead><tr><th>Week</th><th>Days</th><th>Sessions</th><th>Speed</th><th>Focus</th></tr></thead><tbody>${rows}</tbody></table></div>
          ${r.caution ? `<div class="rt-ml">
            <div><p class="eyebrow-label">Caution level</p>${r.caution.probs.map((c) => `<div class="rt-prob ${c.k === r.caution.level ? 'on' : ''} lvl-${c.k}"><span>${esc(c.k)}</span><span class="rt-bar"><span style="width:${Math.round(c.p * 100)}%"></span></span><b class="tabular">${Math.round(c.p * 100)}%</b></div>`).join('')}</div>
            <div><p class="eyebrow-label">What shaped this plan</p>${r.influences && r.influences.length ? `<ul class="rt-list">${r.influences.map((f) => `<li><b>${esc(f.label)}</b> (${esc(f.value)}): ${[Math.abs(f.dSpeed) >= 0.5 ? `speed ${f.dSpeed > 0 ? '+' : '−'}${Math.abs(f.dSpeed).toFixed(1)}%` : '', Math.abs(f.dMin) >= 0.5 ? `time ${f.dMin > 0 ? '+' : '−'}${Math.abs(f.dMin).toFixed(1)} min` : ''].filter(Boolean).join(', ')}</li>`).join('')}</ul><p class="xs muted">Compared with a typical patient in the training data.</p>` : `<p class="xs muted">${r.atFloor ? 'The plan is already at the gentlest settings, so no single factor can lower it further.' : 'This patient is close to the typical case.'}</p>`}
              ${r.assumed && r.assumed.length ? `<p class="xs" style="color:#8a6d12;margin-top:8px">${r.assumed.map(esc).join('. ')}.</p>` : ''}</div>
          </div>` : ''}
          ${r.adjusted && r.adjusted.length ? `<div class="alert warn"><span>&#9881;</span><span><b>Adjusted to the exerciser's safe limits:</b><ul class="rt-list">${r.adjusted.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></span></div>` : ''}
          <div class="grid rt-cols">
            <div><p class="eyebrow-label">Daily tips</p>${ul(p.daily_tips)}</div>
            <div><p class="eyebrow-label" style="color:var(--red-700)">Stop the session if</p>${ul(p.stop_signs)}</div>
            <div><p class="eyebrow-label">Ask the therapist</p>${ul(p.questions_for_therapist)}</div>
          </div>
          <div class="rt-sign"><span>Reviewed and approved by: ______________________</span><span>Date: ____________</span></div>
          <p class="xs muted">This routine is a suggestion generated ${r.sample ? 'from a fixed template' : r.engine === 'model' ? 'by a prototype model trained on simulated data' : 'by a local AI model'}. It is not a medical prescription.
            Set session time and speed on the Live Session page only after a clinician approves it.</p>
        </div></section>`
      $m('#rt-print').onclick = () => window.print()
      $m('#rt-copy').onclick = async () => {
        const txt = [
          'SmartLeg suggested routine (suggestion only, needs clinician approval)',
          `${r.form.name ? r.form.name + ', ' : ''}${r.form.condition}, ${r.form.side} side`,
          p.summary, '',
          ...p.weeks.map((w) => `Week ${w.week}: ${w.days_per_week} days, ${w.sessions_per_day} x ${w.minutes} min at ${w.speed_pct}% speed. ${w.focus}`),
          '', 'Stop the session if: ' + p.stop_signs.join('; '),
        ].join('\n')
        try { await navigator.clipboard.writeText(txt); $m('#rt-copy').textContent = 'Copied' } catch (e) { $m('#rt-copy').textContent = 'Copy failed' }
        setTimeout(() => { const b = $m('#rt-copy'); if (b) b.textContent = 'Copy text' }, 1500)
      }
    }

    function finish(result) { st.result = result; st.error = ''; rtSave('result', result); renderResult(); $m('#rt-out').scrollIntoView({ behavior: 'smooth', block: 'start' }) }

    $m('#rt-sample').onclick = () => {
      readForm()
      const flags = rtRedFlags(form)
      if (flags.length) { finish({ blocked: flags, at: Date.now(), form: { ...form, image: null } }); setStatus(''); return }
      finish({ plan: rtSamplePlan(), adjusted: [], sample: true, at: Date.now(), lang: 'en', form: { ...form, image: null } })
      setStatus('Showing the fixed sample plan.', 'ok')
    }

    $m('#rt-go').onclick = async () => {
      if (st.busy) { if (st.aborter) st.aborter.abort(); return }
      readForm()
      const flags = rtRedFlags(form)
      if (flags.length) { finish({ blocked: flags, at: Date.now(), form: { ...form, image: null } }); setStatus('Stopped by the safety check. The AI was not asked.', 'err'); return }
      if (conn.engine !== 'ollama') {
        if (!mlDoc) { setStatus('No model loaded. Press "Use built-in" or load a model file.', 'err'); return }
        try {
          const t0 = performance.now()
          const res = mlPlan(mlDoc, form)
          finish({ ...res, sample: false, engine: 'model', model: mlDoc.name, at: Date.now(), lang: form.lang, form: { ...form, image: null } })
          setStatus(`Done in ${Math.max(1, Math.round(performance.now() - t0))} ms on this computer. Review it with the therapist.`, 'ok')
        } catch (e) { setStatus(esc(e.message), 'err') }
        return
      }
      if (!form.instructions && !form.image) { setStatus('Add the doctor or physiotherapist instructions first.', 'err'); return }
      conn.url = $m('#rt-url').value.trim().replace(/\/+$/, '') || 'http://localhost:11434'
      conn.model = $m('#rt-model').value
      rtSave('conn', conn)
      if (!conn.model) { setStatus('Press "Check connection" and choose a model first.', 'err'); return }

      const { system, user } = rtPrompt(form)
      const userMsg = { role: 'user', content: user }
      if (form.image) userMsg.images = [form.image]
      st.busy = true; st.startedAt = Date.now(); st.aborter = new AbortController()
      $m('#rt-go').textContent = 'Cancel'
      const timer = setInterval(() => setStatus(`Thinking on this computer... ${Math.round((Date.now() - st.startedAt) / 1000)} s`, 'wait'), 500)
      const killer = setTimeout(() => st.aborter.abort(), 240000)
      try {
        const ask = async (msg) => {
          const res = await fetch(conn.url + '/api/chat', {
            method: 'POST', signal: st.aborter.signal, headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: conn.model, stream: false, format: 'json', options: { temperature: 0.2, num_ctx: 4096 },
              messages: [{ role: 'system', content: system }, msg] }),
          })
          const j = await res.json().catch(() => ({}))
          const errText = !j.error ? '' : (typeof j.error === 'string' ? j.error : (j.error.message || JSON.stringify(j.error)))
          return { ok: res.ok, status: res.status, j, errText }
        }
        let r = await ask(userMsg)
        let photoIgnored = false
        // a text-only model was chosen while a photo is attached
        if (!r.ok && userMsg.images && /multimodal|vision|image/i.test(r.errText)) {
          if (!form.instructions) throw new Error(`"${conn.model}" cannot read photos. Choose a vision model such as qwen2.5vl:3b, or type the instructions.`)
          const textOnly = { role: 'user', content: rtPrompt({ ...form, image: null }).user }
          r = await ask(textOnly)
          photoIgnored = true
        }
        if (!r.ok) throw new Error(r.errText ? `Ollama: ${r.errText}` : `Ollama returned HTTP ${r.status}`)
        const { plan, adjusted } = rtValidate(rtExtractJSON((r.j.message && r.j.message.content) || ''))
        finish({ plan, adjusted, sample: false, model: conn.model, at: Date.now(), lang: form.lang, form: { ...form, image: null } })
        const secs = Math.round((Date.now() - st.startedAt) / 1000)
        setStatus(photoIgnored
          ? `Done in ${secs} s. "${esc(conn.model)}" cannot read photos, so only the typed instructions were used. For photos choose qwen2.5vl:3b.`
          : `Done in ${secs} s. Review it with the therapist.`, photoIgnored ? 'wait' : 'ok')
      } catch (e) {
        const msg = e.name === 'AbortError' ? 'Stopped. The model took too long or you pressed Cancel.'
          : (e instanceof TypeError ? 'Could not reach Ollama. Press "Check connection" for setup steps.' : e.message)
        setStatus(esc(msg), 'err')
        if (e instanceof TypeError) { st.connected = false; showConn() }
      } finally {
        clearInterval(timer); clearTimeout(killer)
        st.busy = false; st.aborter = null
        const b = $m('#rt-go'); if (b) b.textContent = 'Generate suggested routine'
      }
    }

    function showModel() {
      if (!mlDoc) { $m('#rt-mname').textContent = 'No model loaded'; $m('#rt-mmeta').textContent = ''; return }
      const m = mlDoc.metrics
      $m('#rt-mname').textContent = `${mlDoc.name} (${mlDoc.source_file || 'model'})`
      $m('#rt-mmeta').innerHTML = (m ? `Trained on ${Number(m.samples).toLocaleString('en-US')} simulated cases. On ${Number(m.test).toLocaleString('en-US')} unseen test cases: start speed off by ${m.test_mae.start_speed_pct}% on average, caution level right ${Math.round(m.caution_accuracy * 1000) / 10}% of the time.` : '')
        + ' A prototype: it learned conservative rules, not real patient records.'
    }
    function setEngine(e) {
      conn.engine = e; rtSave('conn', conn)
      $m('#rt-tab-model').setAttribute('aria-selected', String(e === 'model'))
      $m('#rt-tab-ollama').setAttribute('aria-selected', String(e === 'ollama'))
      $m('#rt-eng-model').hidden = e !== 'model'
      $m('#rt-eng-ollama').hidden = e !== 'ollama'
      $m('#rt-sample').hidden = e !== 'ollama'
      setStatus('')
      if (e === 'ollama' && st.connected === null) checkConn()
    }
    $m('#rt-tab-model').onclick = () => setEngine('model')
    $m('#rt-tab-ollama').onclick = () => setEngine('ollama')

    showModel(); showConn(); renderResult()
    if (conn.engine === 'ollama') checkConn()
    return {}
  }

  function renderSidebarFoot() {
    const f = $('#sidebar-foot')
    f.innerHTML = S.mode === 'live'
      ? '<button id="to-demo" class="demo">&#9879; Show demo data</button>'
      : '<button id="to-live">&#9673; Back to live data</button>'
    const d = $('#to-demo'), l = $('#to-live')
    if (d) d.onclick = () => { setMode('demo'); stopData(); render() }
    if (l) l.onclick = () => { setMode('live'); stopData(); render() }
  }

  function parseRoute() {
    const h = (location.hash || '#/').slice(1)
    const parts = h.split('/').filter(Boolean)
    if (!parts.length) return { name: 'dashboard' }
    if (parts[0] === 'history' && parts[1]) return { name: 'detail', id: decodeURIComponent(parts[1]) }
    return { name: parts[0] }
  }

  function render() {
    Charts.hideTip()
    const r = parseRoute()
    $('#boot').hidden = true
    const live = S.mode === 'live'

    // login screen
    if (r.name === 'login') { location.hash = '#/'; return }
    if (false) {
      if (live && S.authLoading) { $('#boot').hidden = false; return }
      if (r.name === 'login' && authed && S.mode === 'live') { location.hash = '#/'; return }
      if (r.name !== 'login') { location.hash = '#/login'; return }
      page = null
      $('#app-view').hidden = true
      $('#login-view').hidden = false
      renderLogin()
      return
    }

    $('#login-view').hidden = true
    $('#app-view').hidden = false
    startData()
    renderSidebarFoot()
    renderBanner()
    document.querySelectorAll('.nav a').forEach((a) => {
      const active = a.dataset.route === r.name || (r.name === 'detail' && a.dataset.route === 'history')
      a.classList.toggle('active', active)
      if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current')
    })
    closeMenu()

    const main = $('#main')
    // the routine assistant works without the cloud or a device
    if (r.name === 'routine') { page = pageRoutine(main); window.scrollTo(0, 0); return }
    if (S.loading) { page = null; main.innerHTML = '<div class="spinner">Loading</div>'; return }
    if (S.error) {
      page = null
      main.innerHTML = errorBox(S.error, 'retry-main') + '<p style="margin-top:14px"><button class="btn secondary" id="err-demo">Show demo data instead</button></p>'
      $('#retry-main').onclick = () => { S.loading = true; render(); loadDeviceState() }
      $('#err-demo').onclick = () => { setMode('demo'); stopData(); render() }
      return
    }
    if (!device()) {
      page = null
      main.innerHTML = card('', empty('No device registered', 'Run <code>supabase/schema.sql</code> in Supabase to register your ESP32, then reload.'))
      return
    }
    const pages = { dashboard: pageDashboard, live: pageLive, history: pageHistory, analytics: pageAnalytics, devices: pageDevices }
    if (r.name === 'detail') page = pageDetail(main, r.id)
    else if (pages[r.name]) page = pages[r.name](main)
    else { location.hash = '#/'; return }
    window.scrollTo(0, 0)
  }

  /* mobile menu */
  function openMenu() { $('#sidebar').classList.add('open'); $('#backdrop').hidden = false; $('#open-menu').setAttribute('aria-expanded', 'true') }
  function closeMenu() { $('#sidebar').classList.remove('open'); $('#backdrop').hidden = true; $('#open-menu').setAttribute('aria-expanded', 'false') }

  /* =========================== BOOT =========================== */
  async function boot() {
    $('#open-menu').onclick = openMenu
    $('#close-menu').onclick = closeMenu
    $('#backdrop').onclick = closeMenu
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu() })
    window.addEventListener('hashchange', render)
    window.addEventListener('online', () => { S.browserOnline = true; renderBanner(); if (S.source) { loadDeviceState(); bump() } })
    window.addEventListener('offline', () => { S.browserOnline = false; renderBanner() })

    // one clock drives every live element
    setInterval(() => {
      if ($('#app-view').hidden) return
      renderBanner()
      if (page && page.tick) page.tick()
    }, 1000)

    S.authLoading = false
    render()
  }
  boot()
})()

</script>
</body>
</html>
