:root {
  --navy-950: #1d2419;
  --navy-900: #2b2f27;
  --navy-800: #33402a;
  --navy-700: #3f6b25;
  --teal-50: #f1f6e9;
  --teal-200: #dbe8c6;
  --teal-300: #b6d08f;
  --teal-500: #6c9c44;
  --teal-600: #4a7a2c;
  --teal-700: #3f6b25;
  --amber-50: #fffbeb;
  --amber-100: #fef3c7;
  --amber-300: #fcd34d;
  --amber-500: #f59e0b;
  --amber-800: #92400e;
  --amber-900: #78350f;
  --red-50: #fef2f2;
  --red-200: #fecaca;
  --red-500: #ef4444;
  --red-600: #dc2626;
  --red-700: #b91c1c;
  --green-50: #ecfdf5;
  --green-500: #10b981;
  --green-700: #047857;
  --orange-50: #fff7ed;
  --orange-400: #fb923c;
  --orange-700: #c2410c;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --ink: #2b2f27;
  --canvas: #f5f6ef;
  --paused: #cdd8bb;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(15, 30, 54, .05);
  --font: "Poppins", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
code { font-family: var(--mono); font-size: .9em; background: var(--slate-100); padding: 0 4px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--teal-500); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--slate-500); }
.small { font-size: 12px; }
.xs { font-size: 11px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { display: grid; place-items: center; height: 100%; color: var(--slate-500); }

/* ---------------- shell ---------------- */
.shell { min-height: 100%; display: flex; }
.sidebar { position: sticky; top: 0; height: 100vh; width: 256px; flex-shrink: 0; background: var(--navy-900); padding: 20px 16px; display: flex; flex-direction: column; }
.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding: 0 4px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 36px; height: 36px; }
.brand b { display: block; color: #fff; font-size: 16px; line-height: 1.2; }
.brand small { display: block; color: var(--teal-300); font-size: 11px; line-height: 1.2; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--slate-300); text-decoration: none; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.05); color: #fff; }
.nav a.active { background: rgba(20,184,166,.15); color: var(--teal-200); }
.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sidebar-foot { border-top: 1px solid rgba(255,255,255,.1); padding-top: 16px; }
.sidebar-foot .who { color: var(--slate-400); font-size: 12px; padding: 0 4px 10px; word-break: break-all; }
.sidebar-foot .who b { color: var(--slate-200); font-weight: 500; }
.sidebar-foot button { width: 100%; text-align: left; background: none; border: 0; color: var(--slate-300); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
.sidebar-foot button:hover { background: rgba(255,255,255,.05); color: #fff; }
.sidebar-foot button.demo { color: #fde68a; }
.content { flex: 1; min-width: 0; }
.topbar { display: none; position: sticky; top: 0; z-index: 30; background: var(--navy-900); padding: 12px 16px; align-items: center; justify-content: space-between; }
.icon-btn { background: none; border: 0; color: var(--slate-200); font-size: 20px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.icon-btn:hover { background: rgba(255,255,255,.1); }
.only-mobile { display: none; }
.backdrop { position: fixed; inset: 0; background: rgba(6,16,31,.6); z-index: 39; }
.main { max-width: 1280px; margin: 0 auto; padding: 32px; outline: none; }

@media (max-width: 1023px) {
  .topbar { display: flex; }
  .only-mobile { display: inline-block; }
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: 288px; transform: translateX(-100%); transition: transform .2s; visibility: hidden; }
  .sidebar.open { transform: none; visibility: visible; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .main { padding: 24px 16px; }
}

/* ---------------- banners ---------------- */
.banner-demo { display: flex; align-items: center; gap: 8px; background: var(--amber-100); border-bottom: 1px solid var(--amber-300); color: var(--amber-900); padding: 8px 16px; font-weight: 500; }
.banner-live { display: flex; flex-wrap: wrap; gap: 4px 16px; background: #fff; border-bottom: 1px solid var(--slate-200); padding: 8px 16px; font-size: 12px; color: var(--slate-600); }
.banner-live .tag { color: var(--teal-700); font-weight: 600; }
.banner-live b { color: var(--navy-900); }
.ok { color: var(--green-700); }
.warn { color: var(--amber-800); }
.bad { color: var(--red-700); font-weight: 600; }

/* ---------------- layout helpers ---------------- */
.stack > * + * { margin-top: 24px; }
.grid { display: grid; gap: 24px; }
.g-3 { grid-template-columns: 2fr 1fr; }
.g-2 { grid-template-columns: 1fr 1fr; }
.stats { display: grid; gap: 16px; grid-template-columns: repeat(5, 1fr); }
.stats.six { grid-template-columns: repeat(6, 1fr); }
.stats.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1023px) {
  .g-3, .g-2 { grid-template-columns: 1fr; }
  .stats, .stats.six, .stats.four { grid-template-columns: 1fr 1fr; }
}
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.page-head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; color: var(--navy-900); }
.page-head p { margin-top: 4px; color: var(--slate-500); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------------- cards ---------------- */
.card { background: #fff; border: 1px solid var(--slate-200); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--slate-100); }
.card-head h2 { font-size: 14px; font-weight: 600; color: var(--navy-900); }
.card-body { padding: 20px; }
.link { color: var(--teal-700); font-size: 12px; font-weight: 600; text-decoration: none; }
.link:hover { text-decoration: underline; }
.stat { padding: 20px; }
.stat .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stat .label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500); }
.stat .ico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--slate-100); color: var(--slate-600); font-size: 15px; }
.stat .ico.teal { background: var(--teal-50); color: var(--teal-700); }
.stat .value { margin-top: 8px; font-size: 24px; font-weight: 700; color: var(--navy-900); font-variant-numeric: tabular-nums; }
.stat .hint { margin-top: 4px; font-size: 12px; color: var(--slate-500); }

/* device strip */
.strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 16px; }
@media (max-width: 1023px) { .strip { grid-template-columns: 1fr 1fr; } }
.strip .k { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500); margin-bottom: 4px; }
.strip .v { font-weight: 600; color: var(--navy-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- badges ---------------- */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); white-space: nowrap; }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.b-running { background: var(--teal-50); color: var(--teal-700); } .b-running .dot { background: var(--teal-500); animation: pulse 1.6s infinite; }
.b-paused { background: var(--amber-50); color: var(--amber-800); } .b-paused .dot { background: var(--amber-500); }
.b-stopped { background: var(--slate-100); color: var(--slate-700); } .b-stopped .dot { background: var(--slate-400); }
.b-fault { background: var(--red-50); color: var(--red-700); } .b-fault .dot { background: var(--red-500); animation: pulse 1.2s infinite; }
.b-stale { background: var(--slate-100); color: var(--slate-500); } .b-stale .dot { background: var(--slate-400); }
.b-online { background: var(--green-50); color: var(--green-700); } .b-online .dot { background: var(--green-500); }
.b-offline { background: var(--red-50); color: var(--red-700); } .b-offline .dot { background: var(--red-500); }
.s-badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 500; text-transform: capitalize; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.s-active { background: var(--teal-50); color: var(--teal-700); }
.s-paused { background: var(--amber-50); color: var(--amber-800); }
.s-completed { background: var(--green-50); color: var(--green-700); }
.s-interrupted { background: var(--orange-50); color: var(--orange-700); }
.s-cancelled { background: var(--slate-100); color: var(--slate-600); }
.s-faulted { background: var(--red-50); color: var(--red-700); }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------------- alerts ---------------- */
.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 16px; font-size: 14px; }
.alert.error { background: var(--red-50); border: 1px solid var(--red-200); color: var(--red-700); }
.alert.warn { background: var(--amber-50); border: 1px solid var(--amber-300); color: var(--amber-900); }
.alert button { margin-left: auto; background: none; border: 0; font: inherit; font-weight: 600; text-decoration: underline; color: inherit; cursor: pointer; }

/* ---------------- buttons & inputs ---------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 8px 14px; font: 600 14px var(--font); cursor: pointer; border: 1px solid transparent; text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--teal-600); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--teal-700); }
.btn.secondary { background: #fff; color: var(--navy-900); border-color: var(--slate-300); }
.btn.secondary:hover:not(:disabled) { background: var(--slate-50); }
.btn.danger { background: var(--red-600); color: #fff; }
.btn.demo { background: var(--amber-50); color: var(--amber-900); border-color: var(--amber-300); width: 100%; }
.btn.block { width: 100%; }
.input { width: 100%; border: 1px solid var(--slate-300); border-radius: 8px; padding: 8px 12px; font: 14px var(--font); color: var(--navy-900); background: #fff; }
.input:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px rgba(20,184,166,.2); }
.input:disabled { background: var(--slate-50); }
label.field { display: block; }
label.field > span { display: block; font-size: 12px; font-weight: 500; color: var(--slate-600); margin-bottom: 4px; }
label.field small { display: block; margin-top: 4px; color: var(--slate-400); font-size: 12px; }
.inline-label { display: flex; align-items: center; gap: 8px; color: var(--slate-600); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--slate-300); background: #fff; color: var(--slate-600); border-radius: 999px; padding: 4px 12px; font: 500 12px var(--font); cursor: pointer; text-transform: capitalize; }
.chip:hover { border-color: var(--teal-500); }
.chip[aria-pressed="true"] { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }
.chip.dark[aria-pressed="true"] { background: var(--navy-900); border-color: var(--navy-900); }
.tabs { display: flex; background: var(--slate-100); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font: 600 12px var(--font); color: var(--slate-500); cursor: pointer; text-transform: capitalize; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--navy-900); box-shadow: var(--shadow); }
.filters { display: grid; gap: 12px; grid-template-columns: 1fr auto auto auto; }
@media (max-width: 900px) { .filters { grid-template-columns: 1fr; } }
.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--slate-400); fill: none; stroke-width: 2; }
.search .input { padding-left: 34px; }

/* ---------------- tables ---------------- */
.table-wrap { overflow-x: auto; margin: -20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500); padding: 10px 12px; background: var(--slate-50); border-bottom: 1px solid var(--slate-200); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--slate-100); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 20px; }
th:last-child, td:last-child { padding-right: 20px; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr:focus { background: #f2fbf9; outline: none; }
td.act { color: var(--teal-700); }
td a { text-decoration: none; font-weight: 600; }
td a:hover { color: var(--teal-700); }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; color: var(--slate-600); }
.loading-dim { opacity: .55; }

/* ---------------- live ---------------- */
.timer { font-family: var(--mono); font-weight: 700; color: var(--navy-900); font-size: 56px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.timer.compact { font-size: 38px; }
.timer.stale { opacity: .55; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
@media (max-width: 640px) { .metrics { grid-template-columns: 1fr 1fr; } .timer { font-size: 44px; } }
.metric { border: 1px solid var(--slate-200); border-radius: 12px; padding: 12px; min-width: 0; }
.metric .k { font-size: 12px; color: var(--slate-500); }
.metric .v { margin-top: 4px; font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--navy-900); }
.metric .sub { font-size: 11px; color: var(--slate-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric.teal .k::before, .metric.amber .k::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.metric.teal .k::before { background: var(--teal-600); }
.metric.amber .k::before { background: var(--amber-500); }
.row-gap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 36px 16px; }
.empty .circle { width: 44px; height: 44px; border-radius: 50%; background: var(--slate-100); display: grid; place-items: center; color: var(--slate-500); margin-bottom: 12px; font-size: 18px; }
.empty b { color: var(--navy-900); }
.empty p { margin-top: 4px; max-width: 420px; color: var(--slate-500); }
.oled-frame { max-width: 300px; margin: 0 auto; background: #0f172a; padding: 8px; border-radius: 12px; }
.oled { aspect-ratio: 2 / 1; background: #000; border-radius: 6px; padding: 10px; font: 11px/1.25 var(--mono); color: #e0f2fe; }
.oled .hd { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(224,242,254,.6); padding-bottom: 3px; }
.oled .big { text-align: center; font-size: 22px; font-weight: 700; margin: 3px 0; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: flex; gap: 12px; padding: 6px 0; }
.events .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.events .t { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; }
.events .t b { font-weight: 500; color: var(--navy-900); }
.scroll { max-height: 520px; overflow-y: auto; padding-right: 4px; }

/* ring, bars */
.target { display: flex; align-items: center; gap: 20px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--slate-100); }
.split .k, .kv dt { font-size: 12px; color: var(--slate-500); }
.split .v, .kv dd { font-weight: 600; margin: 2px 0 0; color: var(--navy-900); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin: 0; }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; } }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 0; }
.outcome { margin-bottom: 12px; }
.outcome .top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.track { height: 8px; border-radius: 999px; background: var(--slate-100); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 999px; }
.timeline { display: flex; height: 32px; border-radius: 8px; overflow: hidden; background: var(--slate-100); }
.timeline > i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 12px; color: var(--slate-600); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.note { display: flex; gap: 8px; font-size: 12px; color: var(--slate-500); }
.infobox { margin-top: 20px; background: var(--slate-50); border-radius: 12px; padding: 16px; font-size: 12px; color: var(--slate-600); line-height: 1.6; }
.infobox b { color: var(--navy-900); }

/* skeleton / spinner */
.skeleton { background: linear-gradient(90deg, #e7ecf2 25%, #f1f4f8 50%, #e7ecf2 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.spinner { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--slate-500); }
.spinner::before { content: ""; width: 18px; height: 18px; border: 2px solid var(--teal-600); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11px var(--font); fill: var(--slate-500); }
.tooltip { position: fixed; z-index: 60; pointer-events: none; background: #fff; border: 1px solid var(--slate-200); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 16px rgba(15,30,54,.12); min-width: 140px; }
.tooltip b { display: block; color: var(--navy-900); margin-bottom: 2px; }
.tooltip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.donut-wrap { position: relative; max-width: 200px; margin: 0 auto; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.donut-center b { display: block; font-size: 24px; color: var(--navy-900); }

/* dialog */
dialog { border: 0; border-radius: 16px; padding: 24px; width: min(92vw, 420px); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(6,16,31,.5); }
dialog h2 { font-size: 18px; color: var(--navy-900); margin-bottom: 8px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

/* ---------------- login ---------------- */
.login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100%; }
.login-art { position: relative; overflow: hidden; background: var(--navy-900); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
.login-art .brand img { width: 44px; height: 44px; }
.login-art .brand b { font-size: 20px; }
.login-art .brand small { font-size: 13px; }
.login-art h1 { color: #fff; font-size: 30px; line-height: 1.25; max-width: 440px; }
.login-art p { color: var(--slate-300); margin-top: 16px; max-width: 440px; }
.login-art .foot { color: var(--slate-400); font-size: 12px; }
.login-art svg.rings { position: absolute; right: -96px; bottom: -96px; width: 420px; height: 420px; opacity: .2; }
.login-form { background: #fff; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
.login-form .box { width: 100%; max-width: 360px; }
.login-form h2 { font-size: 24px; color: var(--navy-900); }
.login-form form > * + * { margin-top: 16px; }
.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--slate-400); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--slate-200); }
.login-mobile-brand { display: none; margin-bottom: 32px; }
.login-mobile-brand b { color: var(--navy-900); font-size: 20px; }
@media (max-width: 1023px) {
  .login { grid-template-columns: 1fr; }
  .login-art { display: none; }
  .login-mobile-brand { display: flex; }
}

/* ---------------- print ---------------- */
@media print {
  .no-print, .sidebar, .topbar, #mode-banner { display: none !important; }
  body { background: #fff; }
  .main { padding: 0; max-width: none; }
  .card { break-inside: avoid; box-shadow: none; }
}


/* =====================================================================
   GREEN CALM THEME: cream panels, leaf greens, soft sage cards
   ===================================================================== */
:root { --cream: #fcfde8; --sage: #e3e8d8; --leaf: #3f6b25; --leaf-2: #4a7a2c; --line: #ecefe4; --radius: 22px; --shadow: 0 2px 10px rgba(63, 80, 40, .05); }
body { letter-spacing: .005em; }
.card { border-color: var(--line); }
.card-head { border-bottom-color: #f2f4ec; }
.btn, .chip, .input, .tabs, .tabs button { border-radius: 999px; }
.btn.primary { background: var(--leaf); }
.btn.primary:hover:not(:disabled) { background: #335a1d; }
.stat .ico { background: #eef2e6; color: var(--leaf); border-radius: 50%; }
.stat .ico.teal { background: var(--sage); }
th { background: #f8f9f2; border-bottom-color: var(--line); }
td { border-bottom-color: #f2f4ec; }
tbody tr:hover, tbody tr:focus { background: #f6f9ef; }
.chip.dark[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); }
.banner-demo { background: #fbf7df; border-bottom-color: #ece2a8; color: #6b5a14; }
.banner-live .tag { color: var(--leaf); }
.skeleton { background: linear-gradient(90deg, #eceee4 25%, #f5f6ef 50%, #eceee4 75%); background-size: 200% 100%; }

/* sidebar: light cream instead of dark */
.sidebar { background: var(--cream); border-right: 1px solid var(--line); }
.brand b { color: var(--navy-900); }
.brand small { color: var(--leaf-2); }
.nav a { color: #5c6455; border-radius: 999px; }
.nav a:hover { background: #f1f4e3; color: var(--navy-900); }
.nav a.active { background: var(--leaf); color: #fff; }
.sidebar-foot { border-top-color: var(--line); }
.sidebar-foot .who { color: #7a8471; }
.sidebar-foot .who b { color: var(--navy-900); }
.sidebar-foot button { color: #5c6455; border-radius: 999px; }
.sidebar-foot button:hover { background: #f1f4e3; color: var(--navy-900); }
.sidebar-foot button.demo { color: #8a6d12; }
.topbar { background: var(--cream); border-bottom: 1px solid var(--line); }
.icon-btn { color: var(--navy-900); }
.icon-btn:hover { background: #f1f4e3; }
.backdrop { background: rgba(29, 36, 25, .35); }

/* ---------- hero ---------- */
.hero { position: relative; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; background: #fff;
  border-radius: 28px; overflow: hidden; box-shadow: 0 10px 40px rgba(63, 80, 40, .08); min-height: 440px; }
.hero-left { position: relative; z-index: 1; background: var(--cream); padding: 48px 56px 56px; height: 100%;
  border-bottom-right-radius: 260px; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { color: var(--leaf-2); font-weight: 500; font-size: 14px; margin-bottom: 10px; }
.hero h1 { font-size: clamp(28px, 3.3vw, 42px); line-height: 1.22; font-weight: 600; color: var(--navy-900); letter-spacing: -.01em; max-width: 560px; }
.hero h1 em { font-style: normal; font-weight: 700; color: var(--leaf); }
.lead { margin-top: 18px; font-size: 16px; line-height: 1.65; color: #4a5045; max-width: 470px; }
.trio { display: flex; gap: 44px; margin-top: 30px; }
.trio > div { display: flex; flex-direction: column; }
.trio b { font-size: 20px; font-weight: 600; color: var(--navy-900); }
.trio i { display: block; width: 46px; height: 3px; border-radius: 2px; background: var(--navy-900); margin: 6px 0 10px; }
.trio span { font-size: 12px; color: #5c6455; line-height: 1.5; }
.pill-btn { align-self: flex-start; margin-top: 32px; background: var(--leaf); color: #fff; text-decoration: none; font-weight: 500;
  font-size: 17px; padding: 14px 40px; border-radius: 999px; box-shadow: 0 8px 20px rgba(63, 107, 37, .22); transition: transform .15s, background .15s; }
.pill-btn:hover { background: #335a1d; transform: translateY(-1px); }
.hero-right { position: relative; display: grid; place-items: center; padding: 32px 28px; height: 100%; }
.hero-right::before { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%;
  background: radial-gradient(circle, #f3f7e8 0%, #f8faf2 55%, rgba(255,255,255,0) 72%); }
.gauge-card { position: relative; width: 100%; max-width: 360px; }
.gauge-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.gauge-title { font-weight: 600; color: var(--navy-900); }
.gauge { display: block; width: 100%; height: auto; }
.gauge.stale { opacity: .6; }
.gauge text { font-family: var(--font); }
.gauge .g-value { font-family: var(--mono); font-size: 25px; font-weight: 700; fill: var(--navy-900); }
.gauge .g-label { font-size: 12px; fill: #7a8471; }
.gauge .g-pct { font-size: 12px; font-weight: 600; fill: var(--leaf-2); }
.gauge .g-end { font-size: 11px; fill: #9aa38f; }
.gauge-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.gauge-foot.one { grid-template-columns: 1fr; text-align: center; }
.gauge-foot > div { background: #f6f8ef; border-radius: 16px; padding: 10px 12px; }
.gauge-foot span { display: block; font-size: 11px; color: #7a8471; }
.gauge-foot b { font-family: var(--mono); font-size: 15px; color: var(--navy-900); }
.gauge-foot.one b { font-family: var(--font); font-weight: 500; font-size: 13px; }
.gauge-note { margin-top: 10px; font-size: 11px; color: #9aa38f; text-align: center; }

/* ---------- sage leaf cards ---------- */
.leaf-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.leaf-card { display: flex; align-items: center; gap: 18px; background: var(--sage); border-radius: 30px; padding: 16px 26px 16px 18px;
  text-decoration: none; color: #3d4338; transition: background .15s, transform .15s; min-height: 108px; }
a.leaf-card:hover { background: #dbe2cc; transform: translateY(-1px); }
.leaf-ico { flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 4px 10px rgba(63,80,40,.08); }
.leaf-ico svg { width: 64px; height: 64px; }
.leaf-card b { display: block; font-weight: 600; font-size: 14px; color: var(--navy-900); margin-bottom: 2px; }
.leaf-card p { font-size: 13px; line-height: 1.55; color: #4a5045; }

/* ---------- garden ---------- */
.plant { display: block; width: 100%; max-width: 220px; margin: 0 auto; }
.garden-pct { text-align: center; font-size: 28px; font-weight: 600; color: var(--leaf); margin-top: 4px; }

@media (max-width: 1023px) {
  .hero { grid-template-columns: 1fr; }
  .hero-left { border-bottom-right-radius: 0; border-bottom-left-radius: 0; padding: 32px 24px 40px; }
  .hero-right { padding: 24px 16px 28px; }
  .leaf-cards { grid-template-columns: 1fr; gap: 14px; }
  .trio { gap: 28px; }
}

/* login in the same calm palette */
.login-art { background: var(--cream); }
.login-art h1 { color: var(--navy-900); }
.login-art h1 em { font-style: normal; color: var(--leaf); }
.login-art p { color: #4a5045; }
.login-art .foot { color: #7a8471; }
.login-art .rings { right: 48px; bottom: 70px; width: 240px; }
.login-art .rings .plant { max-width: none; }
.btn.demo { background: #fbf7df; border-color: #ece2a8; color: #6b5a14; }

/* ---------- motor speed + session time ---------- */
.motor .card-body { display: flex; flex-direction: column; }
.speed-wrap { max-width: 330px; margin: 0 auto; width: 100%; }
.speed-gauge { display: block; width: 100%; height: auto; }
.speed-gauge.stale { opacity: .55; }
.speed-gauge text { font-family: var(--font); }
.speed-gauge .s-tick { font-size: 10px; fill: #9aa38f; }
.speed-gauge .s-value { font-size: 30px; font-weight: 600; fill: var(--navy-900); }
.speed-gauge .s-label { font-size: 11px; fill: #7a8471; }
.speed-gauge .s-set { font-size: 11px; font-weight: 500; fill: var(--leaf-2); }
.speed-ctrl { margin-top: 6px; }
.speed-row { display: flex; align-items: center; gap: 14px; }
.round-btn { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #d9e0cc; background: #f6f8ef;
  color: var(--leaf); font: 600 20px/1 var(--font); cursor: pointer; display: grid; place-items: center; }
.round-btn:hover:not(:disabled) { background: #eaf0dc; }
.round-btn:disabled { opacity: .45; cursor: not-allowed; }
input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px;
  background: linear-gradient(90deg, #b6d08f, #3f6b25); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; border: 3px solid var(--leaf); box-shadow: 0 2px 8px rgba(63, 80, 40, .25); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--leaf); cursor: pointer; }
input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--teal-500); outline-offset: 2px; }
input[type="range"]:disabled { opacity: .5; }
.speed-draft { text-align: center; margin-top: 10px; }
.speed-draft b { font-size: 18px; color: var(--navy-900); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.cfg-status { min-height: 20px; margin-top: 12px; text-align: center; font-size: 12px; color: #7a8471; }
.cfg-status.ok { color: var(--leaf-2); }
.cfg-status.ok::before { content: "\2713  "; }
.cfg-status.wait { color: #8a6d12; }
.cfg-status.draft { color: #8a6d12; }
.cfg-status.err { color: var(--red-700); }
.sess-big { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 18px; }
.sess-big > div { text-align: center; min-width: 120px; padding: 18px 10px; border-radius: 50%; background: radial-gradient(circle, #f6f9ee 0%, #fff 70%); }
.sess-big b { display: block; font-size: 56px; font-weight: 600; line-height: 1; color: var(--leaf); }
.sess-big span { font-size: 13px; color: #7a8471; }
.sess-big .round-btn { width: 48px; height: 48px; font-size: 24px; }

/* =====================================================================
   v3 look: sage page, soft green hero, big session control card
   ===================================================================== */
:root { --page: #e2ebe0; --panel: #f6f8f0; --deep: #2f6b1f; --leafc: #7fb069; }
body { background: var(--page); background-image:
  linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
  background-size: 48px 48px; }
.card { background: var(--panel); border-color: #e3eadb; box-shadow: 0 6px 24px rgba(47, 80, 40, .07); border-radius: 24px; }
.card-head { border-bottom-color: #e8eee0; }
.sidebar { background: #f8faf2; }
.eyebrow-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #3b4a33; }
.leaf-deco { position: absolute; color: var(--leafc); opacity: .55; pointer-events: none; }
.leaf-deco svg { width: 100%; height: 100%; display: block; }

/* hero */
.hero2 { position: relative; display: grid; grid-template-columns: 1.25fr 1fr; background: var(--panel); border-radius: 28px;
  overflow: hidden; box-shadow: 0 10px 34px rgba(47, 80, 40, .09); min-height: 300px; }
.hero2-left { position: relative; padding: 36px 40px 70px; background: linear-gradient(135deg, #b9d6a8 0%, #cfe2c0 55%, #e6efd9 100%);
  border-top-right-radius: 220px 300px; border-bottom-right-radius: 40px; }
.hero2-left h1 { margin-top: 14px; font-size: clamp(26px, 3vw, 38px); line-height: 1.22; font-weight: 600; color: #23301d; max-width: 520px; }
.hero2-left h1 em { font-style: normal; font-weight: 700; color: var(--deep); }
.hero2-left .pill-btn { display: inline-block; margin-top: 26px; background: #3f6b33; font-size: 15px; padding: 12px 30px; }
.hero2-band { position: absolute; left: 0; right: 30%; bottom: 0; padding: 12px 40px; background: rgba(63, 107, 51, .82); color: #eef5e6;
  font-size: 14px; border-top-right-radius: 60px; }
.hero2-right { position: relative; padding: 30px 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background-image: linear-gradient(#e3ebdc 1px, transparent 1px), linear-gradient(90deg, #e3ebdc 1px, transparent 1px); background-size: 28px 28px; }
.hero2-right .eyebrow-label { align-self: flex-start; }
.small-gauge { width: 100%; max-width: 280px; }
.hero-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 330px; margin-top: 8px; }
.hero-chips > div, .c-mini > div { background: #cfe2c0; border-radius: 12px; padding: 8px 10px; }
.hero-chips span, .c-mini span { display: block; font-size: 11px; color: #3b4a33; }
.hero-chips b, .c-mini b { font-size: 14px; color: #1f2b1a; }
.h1d { width: 46px; height: 46px; right: 70px; bottom: 90px; transform: rotate(10deg); }
.h2d { width: 30px; height: 30px; right: 40px; bottom: 120px; transform: rotate(-30deg); }
.h3d { width: 56px; height: 56px; right: 18px; top: 14px; transform: rotate(-20deg); }

/* big session control */
.control-card { position: relative; padding: 26px 30px 24px; overflow: hidden; }
.control-head { display: flex; justify-content: space-between; align-items: center; }
.big-gauge { position: relative; max-width: 470px; margin: 4px auto 0; }
.big-gauge::before { content: ""; position: absolute; left: 50%; top: 58%; width: 62%; height: 70%; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(127, 176, 105, .35) 0%, rgba(127, 176, 105, 0) 70%); filter: blur(6px); }
.big-gauge .gauge { position: relative; }
.big-gauge .gauge .g-value { font-size: 30px; }
.c-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 420px; margin: 4px auto 0; text-align: center; }
.target-line { text-align: center; margin-top: 18px; font-size: 16px; color: #23301d; }
.time-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 12px; }
.t-chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid #c9d8bc; background: #f9fbf4; color: #2b3a24;
  border-radius: 12px; padding: 9px 16px; font: 500 15px var(--font); cursor: pointer; }
.t-chip.outline { border-color: var(--deep); color: var(--deep); font-weight: 600; border-radius: 999px; }
.t-chip svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.t-chip:hover:not(:disabled) { background: #eef5e6; }
.t-chip:disabled { opacity: .45; cursor: not-allowed; }
.cmd-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
.cmd { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 10px; border-radius: 999px; border: 0;
  font: 600 20px var(--font); letter-spacing: .04em; cursor: pointer; transition: transform .12s, box-shadow .12s, filter .12s; }
.cmd svg { width: 22px; height: 22px; fill: currentColor; }
.cmd.start { background: linear-gradient(180deg, #2f9a2a, #1f7d1d); color: #fff; box-shadow: 0 8px 20px rgba(31, 125, 29, .32); }
.cmd.stop { background: linear-gradient(180deg, #c9362f, #a8231f); color: #fff; box-shadow: 0 8px 20px rgba(168, 35, 31, .3); }
.cmd.reset { background: #fbfcf7; color: #3b4a33; border: 2px solid #b9c6ad; }
.cmd.reset svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cmd:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.cmd:active:not(:disabled) { transform: translateY(1px); }
.cmd:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.cmd-status { min-height: 22px; margin-top: 14px; text-align: center; font-size: 14px; font-weight: 500; color: #5c6455; }
.cmd-status.wait { color: #8a6d12; }
.cmd-status.ok { color: var(--deep); }
.cmd-status.err { color: var(--red-700); }
.cmd-note { text-align: center; font-size: 12px; color: #7a8471; margin-top: 4px; }
.control-card .l1 { width: 40px; height: 40px; left: 22%; top: 46%; transform: scaleX(-1) rotate(-10deg); }
.control-card .l2 { width: 40px; height: 40px; right: 22%; top: 46%; }
.control-card .l3 { width: 46px; height: 46px; right: 30px; top: 64px; transform: rotate(-15deg); }

/* recent sessions table in green */
.green-table thead th { background: #a9c99b; color: #23301d; border-bottom: 0; }
.green-table tbody tr:nth-child(even) { background: #eef3e8; }
.green-table tbody tr:hover { background: #e3eed9; }

.speed-card .card-body, .garden-card .card-body { min-height: 100%; }

/* sidebar illustration */
.side-art { margin-top: auto; padding: 0 6px 8px; }
.side-art svg { width: 100%; height: auto; display: block; }

@media (max-width: 1023px) {
  .hero2 { grid-template-columns: 1fr; }
  .hero2-left { border-radius: 0 0 40px 0; padding: 28px 22px 64px; }
  .hero2-band { right: 15%; padding: 10px 22px; }
  .cmd-row { gap: 10px; }
  .cmd { font-size: 16px; padding: 15px 6px; gap: 8px; }
  .cmd svg { width: 18px; height: 18px; }
  .control-card { padding: 20px 16px; }
  .control-card .l1, .control-card .l2 { display: none; }

;(function () {
  const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'
  const dtf = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' })
  const df = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium' })
  const tf = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' })
  const dayKeyFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
  const shortDay = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' })
  const monthFmt = new Intl.DateTimeFormat(undefined, { month: 'short', year: '2-digit' })

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  const fmtDateTime = (iso) => (iso ? dtf.format(new Date(iso)) : '-')
  const fmtDate = (iso) => (iso ? df.format(new Date(iso)) : '-')
  const fmtTime = (iso) => (iso ? tf.format(new Date(iso)) : '-')
  const dayKey = (d) => dayKeyFmt.format(d)

  function fmtDuration(sec) {
    const s = Math.max(0, Math.round(sec || 0))
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60
    if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`
    if (m > 0) return `${m}m ${String(r).padStart(2, '0')}s`
    return `${r}s`
  }
  function fmtClock(sec) {
    const s = Math.max(0, Math.floor(sec || 0))
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60)
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
  }
  function fmtAgo(iso, now = Date.now()) {
    if (!iso) return 'never'
    const s = Math.round((now - Date.parse(iso)) / 1000)
    if (s < 5) return 'just now'
    if (s < 60) return `${s}s ago`
    if (s < 3600) return `${Math.floor(s / 60)}m ago`
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`
    return `${Math.floor(s / 86400)}d ago`
  }
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x }
  function rssiLabel(r) {
    if (r == null) return 'Unknown'
    if (r >= -60) return 'Excellent'
    if (r >= -70) return 'Good'
    if (r >= -80) return 'Fair'
    return 'Weak'
  }
  const titleCase = (s) => String(s).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase())
  const r1 = (n) => Math.round(n * 10) / 10

  /* ---------- aggregation of daily rows into chart buckets ---------- */
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d) }
  function toBucket(key, label, rows) {
    const sum = (f) => rows.reduce((a, r) => a + r[f], 0)
    return {
      key, label,
      sessions: sum('sessions'),
      activeMin: r1(sum('active_seconds') / 60),
      pausedMin: r1(sum('paused_seconds') / 60),
      totalMin: r1(sum('total_seconds') / 60),
      completed: sum('completed'),

  }

      No heartbeat from ${esc(d.device_code)} for more than ${d.stale_timeout_seconds}s (last seen ${U.fmtAgo(d.last_seen_at, now)}).
      Values shown are the last ones the ESP32 reported and are not being updated. The device keeps timing locally and
      will sync buffered events when Wi-Fi returns.</div></div>`
  }

  function livePanelHTML(compact) {
    const d = device()
    if (!d) return ''
    const t = liveTimer()
    if (!t.session) {
      return empty('No session in progress', 'Hold START for 1 second on the exerciser to begin. The session appears here automatically.', '&#9632;')
    }
    const s = t.session
    const state = t.online ? d.device_status : (s.session_status === 'paused' ? 'paused' : 'running')
    return `<div class="row-gap">${statusBadge(s.session_status)} ${machineBadge(state, !t.online)} <span class="mono xs muted">${esc(s.session_code)}</span></div>

      <div class="metrics">
        <div class="metric teal"><p class="k">Active (motor running)</p><p class="v">${U.fmtClock(t.active)}</p></div>
        <div class="metric amber"><p class="k">Paused</p><p class="v">${U.fmtClock(t.paused)}</p></div>
        <div class="metric"><p class="k">Started</p><p class="v">${U.fmtTime(s.started_at)}</p><p class="sub">${U.fmtDateTime(s.started_at)}</p></div>

      ${compact ? '' : `<p class="note" style="margin-top:16px"><span>&#9432;</span><span>${t.interpolated
        ? 'Timer counts locally between ESP32 heartbeats and is corrected by every new heartbeat.'
        : 'Showing the last values reported by the ESP32.'} Active time is commanded motor running time; no leg-movement sensor is fitted.</span></p>`}`
  }

  function oledHTML(now = Date.now()) {
    const d = device()
    if (!d) return ''
    const on = isOnline(d, now), t = liveTimer(now), st = d.device_status
    const line = { running: `RUNNING ${d.reported_speed_pct ?? ''}%`, paused: 'PAUSED', fault: 'FAULT', stopped: 'STOPPED' }[st]
    const body = S.live
      ? `<div class="big">${U.fmtClock(t.total)}</div><div>Active ${U.fmtClock(t.active)}</div><div>Pause&nbsp; ${U.fmtClock(t.paused)}</div>`
      : `<div class="big">${st === 'fault' ? '&nbsp;' : 'READY'}</div><div>${st === 'fault' ? 'Hold STOP 2s to clear' : 'Hold START 1s'}</div>`
    return `<div class="oled-frame"><div class="oled"><div class="hd"><span>SmartLeg</span><span>${on ? 'WiFi OK' : '-- --'}</span></div>
      <div>${on ? line : line + ' (last known)'}</div>${body}</div></div>
      <p class="xs muted" style="text-align:center;margin-top:8px">OLED view (reconstructed from the last report)</p>`
  }

  const evColor = {
    session_start: '#14b8a6', resume: '#2dd4bf', pause: '#fbbf24', session_end: '#1c3a66', fault: '#ef4444', fault_cleared: '#10b981',
    reboot: '#8b5cf6', session_recovered: '#a78bfa', limit_reached: '#0ea5e9', wifi_connected: '#34d399', wifi_lost: '#94a3b8',
  }
  function eventSummary(e) {
    const d = e.event_details || {}, p = []
    if (typeof d.status === 'string') p.push('status ' + d.status)
    if (typeof d.reason === 'string') p.push('reason ' + d.reason)
    if (typeof d.fault === 'string') p.push('fault ' + d.fault)
    if (typeof d.active_s === 'number') p.push('active ' + U.fmtClock(d.active_s))
    if (typeof d.paused_s === 'number' && e.event_type === 'session_end') p.push('paused ' + U.fmtClock(d.paused_s))
    if (typeof d.rssi === 'number') p.push(`RSSI ${d.rssi} dBm (${U.rssiLabel(d.rssi)})`)
    if (typeof d.limit === 'string') p.push(d.limit.replace(/_/g, ' '))
    if (typeof d.boot === 'number') p.push('boot #' + d.boot)
    return p.join(' · ')
  }
  function eventsHTML(events, emptyText = 'No events yet.') {
    if (!events || !events.length) return `<p class="muted" style="text-align:center;padding:24px 0">${emptyText}</p>`
    return `<ol class="events">${events.map((e) => {
      const sum = eventSummary(e)
      return `<li><span class="dot" style="background:${evColor[e.event_type] || '#94a3b8'}"></span><div style="flex:1;min-width:0">
        <div class="t"><b>${e.event_type === 'fault' ? '<span style="color:#dc2626">&#9888;</span> ' : ''}${esc(U.titleCase(e.event_type))}</b>
        <time class="xs muted tabular" datetime="${esc(e.event_timestamp)}">${U.fmtDateTime(e.event_timestamp)}</time></div>
        ${sum ? `<p class="xs muted">${esc(sum)}</p>` : ''}</div></li>`
    }).join('')}</ol>`
  }

  function confirmDialog(title, bodyHTML, okLabel = 'Confirm', focusSel = '#confirm-cancel') {
    const dlg = $('#confirm')
    $('#confirm-title').textContent = title
    $('#confirm-body').innerHTML = bodyHTML
    $('#confirm-ok').textContent = okLabel
    return new Promise((resolve) => {
      const done = (v) => { dlg.close(); $('#confirm-ok').onclick = null; $('#confirm-cancel').onclick = null; dlg.oncancel = null; resolve(v) }
      $('#confirm-ok').onclick = () => done(true)
      $('#confirm-cancel').onclick = () => done(false)
      dlg.oncancel = (e) => { e.preventDefault(); done(false) }
      dlg.showModal()
      const f = $(focusSel); if (f) { f.focus(); if (f.select) f.select() }
    })
  }

  /** runs an async loader, ignoring results from superseded calls */
  function loader() {
    let seq = 0
    return async (fn, onData, onError) => {
      const my = ++seq
      try { const d = await fn(); if (my === seq) onData(d) } catch (e) { if (my === seq) onError(e.message || String(e)) }
    }
  }

  /* =========================== PAGES =========================== */

  /* ---------- Motor speed (shared by Dashboard and Live) ---------- */
  const DEFAULT_SPEED = 50, DEFAULT_SESSION = 20, MIN_SPEED = 25
  const canControl = () => S.mode === 'demo' || S.role === 'admin'

  function speedPanel(root) {
    const dis = canControl() ? '' : 'disabled'
    const draft = { speed: device().target_speed_pct ?? DEFAULT_SPEED, dirty: false }
    const maxSpeed = () => device().speed_limit_pct || 80
    root.innerHTML = card('Motor speed (PWM)', `
        <div class="speed-wrap"><div id="m-gauge"></div></div>
        <div class="speed-row">
          <button class="round-btn" id="m-dn" aria-label="Decrease speed by 5" ${dis}>&minus;</button>
          <label class="sr-only" for="m-slider">Speed setting</label>
          <input type="range" id="m-slider" min="${MIN_SPEED}" max="${maxSpeed()}" step="5" value="${draft.speed}" ${dis} />
          <button class="round-btn" id="m-up" aria-label="Increase speed by 5" ${dis}>+</button>
        </div>
        <p class="speed-draft"><b id="m-draft" class="tabular">${draft.speed}%</b> <span class="muted small">new setting</span></p>
        <div class="btn-row">
          <button class="btn secondary" id="m-default" ${dis}>Default speed (${DEFAULT_SPEED}%)</button>
          <button class="btn primary" id="m-apply" ${dis}>Apply speed</button>
        </div>
        <p class="cfg-status" id="m-status"></p>`, '<span class="muted xs">12 V wiper motor &middot; BTS7960</span>', 'speed-card')
    const $r = (sel) => root.querySelector(sel)
    const show = () => { $r('#m-draft').textContent = draft.speed + '%'; $r('#m-slider').value = draft.speed }
    const set = (v) => { delete $r('#m-status').dataset.busy; draft.speed = Math.max(MIN_SPEED, Math.min(maxSpeed(), Math.round(v / 5) * 5)); draft.dirty = true; show(); tick() }
    $r('#m-slider').addEventListener('input', (e) => set(Number(e.target.value)))
    $r('#m-dn').onclick = () => set(draft.speed - 5)
    $r('#m-up').onclick = () => set(draft.speed + 5)
    $r('#m-default').onclick = () => set(DEFAULT_SPEED)
    $r('#m-apply').onclick = async (e) => {
      const dev = device(), btn = e.currentTarget, el = $r('#m-status')
      const cur = dev.target_speed_pct ?? DEFAULT_SPEED
      if (draft.speed === cur) { draft.dirty = false; tick(); return }
      if (isOnline(dev) && dev.device_status === 'running' && draft.speed > cur) {
        const ok = await confirmDialog('Increase motor speed?',
          `The exerciser is running. Speed will rise gently from <b>${cur}%</b> to <b>${draft.speed}%</b>. Make sure the person on the machine is comfortable with a faster pace.`, 'Increase speed')
        if (!ok) return
      }
      btn.disabled = true; el.dataset.busy = '1'; el.className = 'cfg-status'; el.textContent = 'Saving...'
      try { await S.source.updateDevice(dev.id, { target_speed_pct: draft.speed }); draft.dirty = false; await loadDeviceState(); delete el.dataset.busy }
      catch (err) { el.dataset.busy = 'err'; el.className = 'cfg-status err'; el.textContent = err.message || String(err) }
      finally { btn.disabled = !canControl(); tick() }
    }
    function tick() {
      const dev = device(), on = isOnline(dev)
      if (!draft.dirty && dev.target_speed_pct != null && draft.speed !== dev.target_speed_pct) { draft.speed = dev.target_speed_pct; show() }
      $r('#m-slider').max = maxSpeed()
      $r('#m-gauge').innerHTML = Charts.speedGauge(on ? (dev.reported_speed_pct ?? 0) : 0, draft.speed, {
        min: MIN_SPEED, max: maxSpeed(), stale: !on,
        label: !on ? 'device offline' : dev.device_status === 'running' ? 'PWM duty now' : 'motor stopped',
      })
      const el = $r('#m-status')
      if (el.dataset.busy) return
      const pending = (dev.applied_config_version ?? 0) < (dev.config_version ?? 0)
      let cls = 'cfg-status ok', txt
      if (draft.dirty && draft.speed !== dev.target_speed_pct) { cls = 'cfg-status draft'; txt = 'Not saved yet. Press Apply speed.' }
      else if (pending) { cls = 'cfg-status wait'; txt = on ? 'Saved. Waiting for the exerciser to confirm...' : 'Saved. Will apply when the exerciser reconnects.' }
      else txt = dev.applied_speed_pct != null ? `Applied on device: ${dev.applied_speed_pct}%` : 'Waiting for the first report from the device.'
      el.className = cls; el.textContent = txt
    }
    tick()
    return { tick }
  }

  /* ---------- Session control: big gauge, set time, START / STOP / RESET ---------- */
  const CMD_TEXT = {
    start: { pending: 'Sending START...', acknowledged: 'Exerciser received START...', executed: 'Started on the exerciser.' },
    stop: { pending: 'Sending STOP...', acknowledged: 'Exerciser received STOP...', executed: 'Stopped. Session saved.' },
    reset: { pending: 'Sending RESET...', acknowledged: 'Exerciser received RESET...', executed: 'Reset. Ready for a new session.' },
  }

  function controlCard(root) {
    const ctl = canControl()
    let busyCmd = null          // { id, type, until }
    root.innerHTML = `<section class="card control-card">
      <div class="control-head"><h2 class="eyebrow-label">This session</h2><span id="c-badge"></span></div>
      <span class="leaf-deco l1" aria-hidden="true">${leafSVG()}</span><span class="leaf-deco l2" aria-hidden="true">${leafSVG()}</span><span class="leaf-deco l3" aria-hidden="true">${leafSVG()}</span>
      <div class="big-gauge" id="c-gauge"></div>
      <div class="c-mini" id="c-mini"></div>
      <p class="target-line">Target session: <b id="c-target">-</b> <span id="c-tstatus" class="muted small"></span></p>
      <div class="time-chips" role="group" aria-label="Session time">
        <button class="t-chip outline" id="c-set" ${ctl ? '' : 'disabled'}><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>SET TIME</button>
        <button class="t-chip" data-delta="10" ${ctl ? '' : 'disabled'}>+10 min</button>
        <button class="t-chip" data-delta="-10" ${ctl ? '' : 'disabled'}>&minus;10 min</button>
        <button class="t-chip" data-abs="${DEFAULT_SESSION}" ${ctl ? '' : 'disabled'}>${DEFAULT_SESSION} min</button>
      </div>
      <div class="cmd-row">
        <button class="cmd start" id="c-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span id="c-start-lbl">START</span></button>
        <button class="cmd stop" id="c-stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>STOP</button>
        <button class="cmd reset" id="c-reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>RESET</button>
      </div>
      <p class="cmd-status" id="c-status" role="status"></p>
      <p class="cmd-note">${ctl
        ? 'Commands reach the exerciser within a few seconds. The red E-stop and the buttons on the machine always work, even without internet.'
        : ''}</p>
    </section>`
    const $r = (sel) => root.querySelector(sel)

    async function setMinutes(m) {
      const dev = device()
      m = Math.max(1, Math.min(60, Math.round(m)))
      if (m === dev.session_minutes) return
      const el = $r('#c-tstatus')
      el.textContent = 'saving...'
      try { await S.source.updateDevice(dev.id, { session_minutes: m }); el.textContent = ''; await loadDeviceState() }
      catch (err) { el.textContent = err.message || String(err) }
      tick()
    }
    root.querySelectorAll('[data-delta]').forEach((b) => { b.onclick = () => setMinutes((device().session_minutes || DEFAULT_SESSION) + Number(b.dataset.delta)) })
    root.querySelector('[data-abs]').onclick = () => setMinutes(DEFAULT_SESSION)
    $r('#c-set').onclick = async () => {
      const cur = device().session_minutes || DEFAULT_SESSION
      const ok = await confirmDialog('Set session time', `<label class="field" style="margin-top:8px"><span>Minutes of motor running time (1 to 60)</span>
        <input class="input" type="number" id="c-min-input" min="1" max="60" value="${cur}" /></label>`, 'Set time', '#c-min-input')
      if (!ok) return
      const v = Number(document.getElementById('c-min-input').value)
      if (v >= 1 && v <= 60) setMinutes(v)
    }

    async function send(type) {
      const dev = device()
      if (type === 'start') {
        const paused = S.live && (dev.device_status === 'paused' || S.live.session.session_status === 'paused')
        const ok = await confirmDialog(paused ? 'Resume the exerciser?' : 'Start the exerciser?',
          `The motor will start at <b>${dev.applied_speed_pct ?? dev.target_speed_pct ?? DEFAULT_SPEED}%</b> speed for a
           <b>${dev.applied_session_minutes || dev.session_minutes || DEFAULT_SESSION} minute</b> session.
           Check that the person is seated, feet are secured and nothing is caught in the mechanism.`, paused ? 'Resume' : 'Start motor')
        if (!ok) return
      }
      if (type === 'reset') {
        const ok = await confirmDialog('Reset the session?', S.live
          ? 'The motor stops and the current session is saved as <b>cancelled</b>. The timer returns to the full session time.'
          : 'Clears the exerciser back to READY (and clears a fault once the E-stop is released).', 'Reset')
        if (!ok) return
      }
      const el = $r('#c-status')
      el.className = 'cmd-status wait'; el.textContent = CMD_TEXT[type].pending
      try {
        const id = await S.source.sendCommand(dev.id, type)
        busyCmd = { id, type, until: Date.now() + 25000 }
        tick()
        poll()
      } catch (err) {
        el.className = 'cmd-status err'; el.textContent = err.message || String(err)
      }
    }
    async function poll() {
      if (!busyCmd) return
      const my = busyCmd
      let c = null
      try { c = await S.source.getCommand(my.id) } catch (e) { /* retry */ }
      if (busyCmd !== my) return
      const el = $r('#c-status')
      if (c && (c.command_status === 'executed' || c.command_status === 'failed' || c.command_status === 'expired')) {
        busyCmd = null
        if (c.command_status === 'executed') { el.className = 'cmd-status ok'; el.textContent = CMD_TEXT[my.type].executed }
        else if (c.command_status === 'failed') { el.className = 'cmd-status err'; el.textContent = `${my.type.toUpperCase()} refused by the exerciser: ${c.error_message || 'unknown reason'}` }
        else { el.className = 'cmd-status err'; el.textContent = `${my.type.toUpperCase()} was not delivered (${c.error_message || 'expired'}). Nothing was changed.` }
        loadDeviceState(); bump(); tick()
        return
      }
      if (Date.now() > my.until) { busyCmd = null; el.className = 'cmd-status err'; el.textContent = 'No answer from the exerciser. Check it on the machine.'; tick(); return }
      if (c && CMD_TEXT[my.type][c.command_status]) el.textContent = CMD_TEXT[my.type][c.command_status]
      setTimeout(poll, 700)
    }
    $r('#c-start').onclick = () => send('start')
    $r('#c-stop').onclick = () => send('stop')
    $r('#c-reset').onclick = () => send('reset')

    function tick() {
      const dev = device(), t = liveTimer(), on = isOnline(dev)
      const sessMin = dev.applied_session_minutes || dev.session_minutes || DEFAULT_SESSION
      const goal = sessMin * 60
      const state = t.session ? (t.online ? dev.device_status : (t.session.session_status === 'paused' ? 'paused' : 'running')) : dev.device_status
      $r('#c-badge').innerHTML = machineBadge(state, !on)
      $r('#c-gauge').innerHTML = t.session
        ? Charts.gauge(t.active, goal, { value: U.fmtClock(Math.max(0, goal - t.active)), label: 'left in session', stale: !on })
        : Charts.gauge(0, goal, { value: U.fmtClock(goal), label: dev.device_status === 'fault' ? 'fault, press RESET' : 'ready to start', muted: true })
      $r('#c-mini').innerHTML = `
        <div><span>Active</span><b class="tabular">${U.fmtClock(t.active)}</b></div>
        <div><span>Speed</span><b class="tabular">${on ? (dev.reported_speed_pct ?? 0) : '-'}%</b></div>
        <div><span>Paused</span><b class="tabular">${U.fmtClock(t.paused)}</b></div>`
      $r('#c-target').textContent = `${dev.session_minutes || DEFAULT_SESSION} min`
      const ts = $r('#c-tstatus')
      if (ts.textContent !== 'saving...' && !/error|denied|permission|violates/i.test(ts.textContent)) {
        ts.textContent = (dev.applied_config_version ?? 0) < (dev.config_version ?? 0) ? '(waiting for exerciser)' : (dev.applied_session_minutes ? '(applied)' : '')
      }
      const paused = state === 'paused'
      $r('#c-start-lbl').textContent = paused ? 'RESUME' : 'START'
      const busy = Boolean(busyCmd)
      $r('#c-start').disabled = !ctl || !on || busy || state === 'running' || state === 'fault'
      $r('#c-stop').disabled = !ctl || !on || busy || !t.session
      $r('#c-reset').disabled = !ctl || !on || busy || (!t.session && state !== 'fault')
      const el = $r('#c-status')
      if (!busy && !el.textContent && !on) { el.className = 'cmd-status err'; el.textContent = 'Exerciser offline. Use the buttons on the machine.' }
      if (!busy && el.textContent === 'Exerciser offline. Use the buttons on the machine.' && on) el.textContent = ''
    }
    tick()
    return { tick }
  }

    function drawLive() {

      $('#h-gauge', main).innerHTML = t.session
        ? Charts.gauge(t.active, goal, { value: U.fmtClock(Math.max(0, goal - t.active)), label: 'left in session', stale: !on })
        : Charts.gauge(0, goal, { value: U.fmtClock(goal), label: 'ready to start', muted: true })
      $('#h-chips', main).innerHTML = `

        <p class="muted" style="text-align:center">${U.fmtDuration(ta)} of ${dev.daily_target_minutes} min today${data ? ` &middot; ${data.todayT.sessions} session(s)` : ''}</p>

    function drawRest() {
      const a = data.all
      $('#stats', main).innerHTML =
        stat('Total sessions', a.sessions, 'All stored sessions', '&#127793;') +
        stat('Total active', U.fmtDuration(a.active_seconds), 'Motor running, all time', '&#127807;', true) +
        stat('Total paused', U.fmtDuration(a.paused_seconds), 'Rest between, all time', '&#127811;') +
        stat('Avg session', U.fmtDuration(a.avg_session_seconds), 'Ended sessions', '&#9201;') +
        stat('Completed', a.completed, `of ${a.completed + a.interrupted + a.cancelled + a.faulted} ended`, '&#10003;', true)
      $('#recent', main).innerHTML = !data.recent.length
        ? empty('No sessions recorded yet', 'Sessions appear here as soon as the ESP32 reports them.', '&#127793;')
        : `<div class="table-wrap"><table class="green-table"><thead><tr><th>Started</th><th>Total</th><th>Active</th><th>Paused</th><th>Status</th></tr></thead><tbody>
          ${data.recent.map((s) => `<tr data-href="#/history/${encodeURIComponent(s.id)}" tabindex="0">

            <td class="tabular">${U.fmtDuration(s.total_duration_seconds)}</td><td class="tabular act">${U.fmtDuration(s.active_duration_seconds)}</td>
            <td class="tabular">${U.fmtDuration(s.paused_duration_seconds)}</td><td>${statusBadge(s.session_status)}</td></tr>`).join('')}
          </tbody></table></div>`
      bindRowLinks(main)
      drawLive()
      drawChart()
    }

    function refresh() {
      const dev = device()
      if (!dev) return
      const today = U.startOfToday(), tomorrow = U.addDays(today, 1)
      const yearAgo = new Date(today.getFullYear(), today.getMonth() - 11, 1)
      load(async () => {
        const [all, todayT, daily, recent] = await Promise.all([
          S.source.getTotals(dev.id, new Date(0).toISOString(), tomorrow.toISOString()),
          S.source.getTotals(dev.id, today.toISOString(), tomorrow.toISOString()),
          S.source.getDaily(dev.id, yearAgo.toISOString(), tomorrow.toISOString(), U.TZ),
          S.source.listSessions({ deviceId: dev.id, sort: 'newest', page: 0, pageSize: 6 }),
        ])
        return { all, todayT, daily, recent: recent.rows }
      }, (d) => { data = d; $('#err', main).innerHTML = ''; drawRest() },
      (msg) => { $('#err', main).innerHTML = errorBox(msg, 'retry-dash'); $('#retry-dash').onclick = refresh })
    }

    function tick() {
      $('#stale', main).innerHTML = staleHTML()
      drawLive(); control.tick(); speed.tick()
    }
    tick(); refresh()
    return { tick, refresh, onDeviceState: tick }
  }

  /* ---------- History ---------- */
  const PAGE_SIZE = 20
  function localDateIso(d, endOfDay) {
    if (!d) return undefined
    const [y, m, day] = d.split('-').map(Number)
    return new Date(y, m - 1, day + (endOfDay ? 1 : 0)).toISOString()
  }

  function pageHistory(main) {
    const h = ui.history
    main.innerHTML = `<div class="stack">
      ${head('Session history', 'Every session stored in the database. Durations are measured by the ESP32.',
        '<button class="btn secondary" id="export" disabled>&#11015; Export CSV</button>')}
      <div id="exp-err"></div>
      ${card('', `
        <div class="filters">
          <label class="search"><span class="sr-only">Search by session ID</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

          <label class="inline-label">To <input type="date" class="input" id="f-to" value="${esc(h.to)}" /></label>
          <label class="inline-label">Sort <select class="input" id="f-sort">

    $('#f-sort', main).value = h.sort

    $('#f-from', main).addEventListener('change', (e) => { h.from = e.target.value; change() })

    main.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', () => {
      const s = b.dataset.status

    $('#f-clear', main).addEventListener('click', () => {
      Object.assign(h, { search: '', statuses: [], from: '', to: '' })
      $('#f-search', main).value = ''; $('#f-from', main).value = ''; $('#f-to', main).value = ''

          ['end_time', (s) => (s.ended_at ? U.fmtTime(s.ended_at) : '')], ['started_at_utc', (s) => s.started_at], ['ended_at_utc', (s) => s.ended_at || ''],
          ['total_duration', (s) => U.fmtClock(s.total_duration_seconds)], ['active_duration', (s) => U.fmtClock(s.active_duration_seconds)],

    function draw(res) {
      lastCount = res.count
      $('#export', main).disabled = !res.count
      const pages = Math.max(1, Math.ceil(res.count / PAGE_SIZE))
      if (!res.rows.length) {
        $('#tbl', main).innerHTML = hasFilters()
          ? empty('No sessions match these filters', 'Try widening the date range or clearing filters.')
          : empty('No sessions recorded yet', 'Start a session on the exerciser and it will be stored here.')
        return
      }
      $('#tbl', main).innerHTML = `<div class="table-wrap" style="margin-bottom:0"><table style="min-width:820px">
        <thead><tr><th>Session ID</th><th>Date</th><th>Start</th><th>End</th><th>Total</th><th>Active</th><th>Paused</th><th>Status</th></tr></thead>
        <tbody>${res.rows.map((s) => `<tr data-href="#/history/${encodeURIComponent(s.id)}" tabindex="0">
          <td><a class="mono xs" href="#/history/${encodeURIComponent(s.id)}">${esc(s.session_code)}</a></td>
          <td>${U.fmtDate(s.started_at)}</td><td class="tabular">${U.fmtTime(s.started_at)}</td>
          <td class="tabular">${s.ended_at ? U.fmtTime(s.ended_at) : '<span class="muted">in progress</span>'}</td>
          <td class="tabular" style="font-weight:500">${U.fmtDuration(s.total_duration_seconds)}</td>
          <td class="tabular act">${U.fmtDuration(s.active_duration_seconds)}</td>
          <td class="tabular">${U.fmtDuration(s.paused_duration_seconds)}</td><td>${statusBadge(s.session_status)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="pager"><p>${res.count} session${res.count === 1 ? '' : 's'} &middot; page ${h.page + 1} of ${pages}</p>
          <div class="actions"><button class="btn secondary" id="prev" ${h.page === 0 ? 'disabled' : ''} aria-label="Previous page">&#8249; Prev</button>
          <button class="btn secondary" id="next" ${h.page >= pages - 1 ? 'disabled' : ''} aria-label="Next page">Next &#8250;</button></div></div>`
      bindRowLinks(main)
      $('#prev', main).onclick = () => { h.page = Math.max(0, h.page - 1); refresh() }
      $('#next', main).onclick = () => { h.page = Math.min(pages - 1, h.page + 1); refresh() }
    }

    function refresh() {
      if (!device()) return
      const t = $('#tbl', main).firstElementChild
      if (t) t.classList.add('loading-dim')
      load(() => S.source.listSessions(Object.assign(query(), { page: h.page, pageSize: PAGE_SIZE })),
        (res) => { $('#err', main).innerHTML = ''; draw(res) },
        (msg) => { $('#err', main).innerHTML = errorBox(msg, 'retry-h'); $('#retry-h').onclick = refresh })
    }
    refresh()
    return { refresh }
  }

  /* ---------- Session detail ---------- */
  function buildSegments(s, events) {
    const start = Date.parse(s.started_at)
    const end = s.ended_at ? Date.parse(s.ended_at) : Date.parse(s.updated_at)
    if (!(end > start)) return []
    const segs = []
    let cur = 'run', t = start
    for (const e of events) {
      const et = Date.parse(e.event_timestamp)
      const next = e.event_type === 'pause' || e.event_type === 'session_recovered' ? 'pause' : e.event_type === 'resume' ? 'run' : null
      if (!next || et <= start) continue
      if (et > t) segs.push({ kind: cur, start: t, end: Math.min(et, end) })
      t = Math.max(t, et); cur = next
    }
    if (end > t) segs.push({ kind: cur, start: t, end })
    return segs
  }

  function pageDetail(main, id) {
    main.innerHTML = '<div class="spinner">Loading</div>'
    const load = loader()
    function refresh() {
      load(async () => {
        const [s, ev] = await Promise.all([S.source.getSession(id), S.source.listSessionEvents(id)])
        return { s, ev }
      }, ({ s, ev }) => {
        if (!s) { main.innerHTML = card('', empty('Session not found', '<a class="link" href="#/history">Back to history</a>')); return }
        const segs = buildSegments(s, ev)
        const span = segs.length ? segs[segs.length - 1].end - segs[0].start : 0
        const share = s.total_duration_seconds ? Math.round((s.active_duration_seconds / s.total_duration_seconds) * 100) + '%' : '-'
        const tl = !segs.length ? '<p class="muted">No timeline available.</p>' : `
          <div class="timeline" role="img" aria-label="Session timeline of running and paused periods">
            ${segs.map((g) => `<i title="${g.kind === 'run' ? 'Running' : 'Paused'} ${U.fmtTime(new Date(g.start).toISOString())} to ${U.fmtTime(new Date(g.end).toISOString())} (${U.fmtDuration((g.end - g.start) / 1000)})"
              style="width:${span ? ((g.end - g.start) / span) * 100 : 0}%;background:${g.kind === 'run' ? '#0d9488' : '#fcd34d'}"></i>`).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px" class="xs muted tabular">
            <span>${U.fmtTime(s.started_at)}</span>
            <span class="legend" style="margin:0"><span><i style="background:#0d9488;border-radius:2px"></i>Running</span><span><i style="background:#fcd34d;border-radius:2px"></i>Paused</span></span>
            <span>${s.ended_at ? U.fmtTime(s.ended_at) : 'now'}</span></div>
          <p class="xs" style="margin-top:8px;color:var(--slate-400)">Timeline is drawn from event timestamps. The duration figures above come from the ESP32's own timers and are authoritative.</p>`
        main.innerHTML = `<div class="stack">
          <a href="#/history" class="link no-print" style="font-size:14px;color:var(--slate-500)">&#8592; Session history</a>
          ${head(s.session_code, `${statusBadge(s.session_status)} ${U.fmtDateTime(s.started_at)}${s.ended_at ? ' to ' + U.fmtTime(s.ended_at) : ' (in progress)'}`)}
          <div class="stats four">
            ${stat('Total duration', U.fmtClock(s.total_duration_seconds))}
            ${stat('Active (motor running)', U.fmtClock(s.active_duration_seconds))}
            ${stat('Paused', U.fmtClock(s.paused_duration_seconds))}
            ${stat('Active share', share)}
          </div>
          ${s.fault_summary ? errorBox('Fault recorded: ' + s.fault_summary) : ''}
          ${card('Timeline', tl)}
          ${card(`Event log (${ev.length})`, eventsHTML(ev, 'No events stored for this session.'))}
        </div>`
      }, (msg) => { main.innerHTML = errorBox(msg, 'retry-d'); $('#retry-d').onclick = refresh })
    }
    refresh()
    return { refresh }
  }

  /* ---------- Analytics ---------- */
  function pageAnalytics(main) {
    const a = ui.analytics
    const presets = [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['365', '12 months'], ['custom', 'Custom']]
    main.innerHTML = `<div class="stack">
      <div id="ahead"></div>
      <div class="chips no-print">
        ${presets.map(([k, l]) => `<button class="chip dark" style="text-transform:none" data-preset="${k}" aria-pressed="${a.preset === k}">${l}</button>`).join('')}
        <span id="custom" class="chips" ${a.preset === 'custom' ? '' : 'hidden'}>
          <input type="date" class="input" style="width:auto" id="a-from" aria-label="From date" value="${esc(a.from)}" /> to
          <input type="date" class="input" style="width:auto" id="a-to" aria-label="To date" value="${esc(a.to)}" /></span>
      </div>
      <div id="err"></div>
      <div id="body">${skel(400)}</div>
      <p class="note"><span>&#9432;</span><span>These figures describe how long the exerciser motor ran. They are an activity log, not a measure of medical recovery or clinical progress.</span></p>
    </div>`
    const load = loader()
    let buckets = []

    function range() {
      if (a.preset !== 'custom') { const n = Number(a.preset); return { from: U.addDays(U.startOfToday(), -(n - 1)), days: n } }
      const [fy, fm, fd] = a.from.split('-').map(Number), [ty, tm, td] = a.to.split('-').map(Number)
      const f = new Date(fy, fm - 1, fd), t = new Date(ty, tm - 1, td)
      return { from: f, days: Math.max(1, Math.min(731, Math.round((t - f) / 86400000) + 1)) }
    }

    main.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
      a.preset = b.dataset.preset
      main.querySelectorAll('[data-preset]').forEach((x) => x.setAttribute('aria-pressed', x === b))
      $('#custom', main).hidden = a.preset !== 'custom'
      refresh()
    }))
    $('#a-from', main).addEventListener('change', (e) => { if (e.target.value) { a.from = e.target.value; refresh() } })
    $('#a-to', main).addEventListener('change', (e) => { if (e.target.value) { a.to = e.target.value; refresh() } })

    function refresh() {
      const dev = device()
      if (!dev) return
      const { from, days } = range()
      const to = U.addDays(from, days)
      $('#ahead', main).innerHTML = head('Exercise analytics',
        `${U.fmtDate(from.toISOString())} to ${U.fmtDate(U.addDays(to, -1).toISOString())} &middot; ${esc(dev.device_name)}`,
        '<button class="btn secondary" id="a-csv">&#11015; CSV report</button><button class="btn secondary" id="a-print">&#128438; Print</button>')
      $('#a-print', main).onclick = () => window.print()
      $('#a-csv', main).onclick = () => {
        const target = device().daily_target_minutes
        U.downloadCsv(`smartleg-report-${S.source.mode}-${U.dayKey(from)}_to_${U.dayKey(U.addDays(to, -1))}.csv`, U.toCsv(buckets, [
          ['date', (b) => b.key], ['sessions', (b) => b.sessions], ['completed_sessions', (b) => b.completed],
          ['active_minutes', (b) => b.activeMin], ['paused_minutes', (b) => b.pausedMin], ['total_minutes', (b) => b.totalMin],
          ['target_minutes', () => target], ['target_met', (b) => (b.activeMin >= target ? 'yes' : 'no')],
        ]))
      }
      load(async () => {
        const [totals, daily] = await Promise.all([
          S.source.getTotals(dev.id, from.toISOString(), to.toISOString()),
          S.source.getDaily(dev.id, from.toISOString(), to.toISOString(), U.TZ),
        ])
        return { totals, daily }
      }, ({ totals: t, daily }) => {
        $('#err', main).innerHTML = ''
        const target = device().daily_target_minutes
        buckets = U.dailyBuckets(daily, from, days)
        if (!t.sessions) { $('#body', main).innerHTML = card('', empty('No sessions in this period', 'Pick a wider date range.')); return }
        const ended = t.completed + t.interrupted + t.cancelled + t.faulted
        const rate = ended ? Math.round((t.completed / ended) * 100) : 0
        const met = buckets.filter((b) => b.activeMin >= target).length
        const activeDays = buckets.filter((b) => b.sessions > 0).length
        const outcomes = [['completed', '#10b981'], ['interrupted', '#fb923c'], ['cancelled', '#94a3b8'], ['faulted', '#ef4444']]
        $('#body', main).innerHTML = `<div class="stack">
          <div class="stats six">
            ${stat('Sessions', t.sessions, `${activeDays} active day(s)`)}
            ${stat('Active time', U.fmtDuration(t.active_seconds))}
            ${stat('Paused time', U.fmtDuration(t.paused_seconds))}
            ${stat('Avg session', U.fmtDuration(t.avg_session_seconds))}
            ${stat('Completion rate', rate + '%', `${t.completed} of ${ended} ended`)}
            ${stat('Target met', `${met}/${days}`, `days with &ge; ${target} min active`)}
          </div>
          ${card('Daily active minutes vs target', `<div id="c-act"></div><div class="legend"><span><i style="background:${Charts.colors.active}"></i>Active</span><span><i style="background:${Charts.colors.paused}"></i>Paused</span><span><i style="background:none;border-top:2px dashed ${Charts.colors.navy};border-radius:0;height:0;width:14px"></i>Target</span></div>`)}
          <div class="grid g-3">
            ${card('Sessions per day', '<div id="c-ses"></div>')}
            ${card('Active vs paused', `<div id="c-don"></div><div class="legend"><span><i style="background:${Charts.colors.active}"></i>Active ${U.fmtDuration(t.active_seconds)}</span><span><i style="background:${Charts.colors.paused}"></i>Paused ${U.fmtDuration(t.paused_seconds)}</span></div>`)}
          </div>
          <div class="grid g-3">
            ${card('Long-term trend', `<div id="c-tr"></div><div class="legend"><span><i style="background:${Charts.colors.active};opacity:.5"></i>Daily active</span><span><i style="background:${Charts.colors.trend}"></i>7-day average</span></div>`)}
            ${card('Session outcomes', outcomes.map(([k, c]) => `<div class="outcome"><div class="top"><span class="muted" style="text-transform:capitalize">${k}</span><b class="tabular">${t[k]}</b></div>
              <div class="track"><i style="width:${ended ? (t[k] / ended) * 100 : 0}%;background:${c}"></i></div></div>`).join(''))}
          </div></div>`
        Charts.activity($('#c-act', main), buckets, { target, height: 280 })
        Charts.bars($('#c-ses', main), buckets)
        Charts.donut($('#c-don', main), t.active_seconds, t.paused_seconds)
        const avg = U.movingAverage(buckets.map((b) => b.activeMin), 7)
        Charts.trend($('#c-tr', main), buckets.map((b, i) => ({ label: b.label, activeMin: b.activeMin, avg: avg[i] })))
      }, (msg) => { $('#err', main).innerHTML = errorBox(msg, 'retry-a'); $('#retry-a').onclick = refresh })
    }
    refresh()
    return { refresh }
  }

  /* ---------- Device ---------- */
  function pageDevices(main) {
    const d = device()
    const canEdit = S.mode === 'demo' || S.role === 'admin'
    const picker = S.devices.length > 1
      ? `<select class="input" id="dev-pick" aria-label="Select device">${S.devices.map((x) => `<option value="${esc(x.id)}" ${x.id === d.id ? 'selected' : ''}>${esc(x.device_name)} (${esc(x.device_code)})</option>`).join('')}</select>`
      : ''
    main.innerHTML = `<div class="stack">
      ${head('Device', 'ESP32 status, settings and fault history.', picker)}
